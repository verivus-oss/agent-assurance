# Commit SHAs cited in tracked prose that do not resolve in this repository.
#
# Consumed by validators/check_commit_citations.py, which fails CI on any
# commit-shaped token in docs/issues/ or validators/ that git cannot resolve
# and that is not recorded here.
#
# THE CONTRACT, the same one conformance/known-divergences.toml and
# conformance/coverage-baseline.toml carry: this is a record of a known,
# bounded gap, not permission for it. Adding an entry is a deliberate act that
# needs a reason stated in the entry. Removing one is the expected direction of
# travel. A new unresolvable citation is a build break, which is the whole
# point: the repository's own rule is that a claim naming a commit must name
# one a reader can resolve.
#
# WHY THESE EXIST
#
# The repository was re-minted. Its root commit is `eccdcab`, "Mint
# agent-assurance spec", dated 2026-05-27, and it carries no history before
# that date. ISS-001 through ISS-004 were opened on 2026-05-23 and 2026-05-24,
# against the pre-mint tree, and cite commits from it. ISS-005, opened
# 2026-06-01, cites `91e050a` and `4176bf9`, and both resolve. The split is
# exactly the mint boundary.
#
# The issues themselves are not wrong. Their technical content has been
# re-derived and holds. What is unavailable is the ability to follow a cited
# commit and check the claim against it, which is the property this repository
# exists to guarantee. Each affected issue now says so at the point of use.

[meta]
document_kind  = "unresolvable-commit-citations"
schema_version = "0.1.0"
normative      = false
last_verified  = "2026-08-29"
root_commit    = "eccdcab"       # first commit this repository carries
root_committed = "2026-05-27"

# Commit-shaped tokens that are NOT commit citations. Each needs a reason.
[[not_a_commit]]
token  = "0123456789abcdef"
file   = "validators/validate_provenance.py"
reason = "The lowercase hex alphabet, used as a membership set when validating that a digest contains only hex characters. Not a citation."

# Commit citations that do not resolve. Every one predates `eccdcab`.
