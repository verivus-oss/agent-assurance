[package]
name = "toml-test-decode-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "toml-test decoder shim using the `toml` 0.8 crate — the same parser dagtoml-validate-rs depends on. Reads TOML on stdin, emits toml-test tagged-JSON on stdout, exits non-zero on parse error. Symmetric with the Go-side BurntSushi/toml decoder wired into CI; together they prove that BOTH primary validator parsers (Rust + Go) round-trip the TOML 1.0 spec corpus correctly."
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
toml       = { version = "1.1", default-features = false, features = ["parse"] }
serde_json = "1"

[[bin]]
name = "toml-test-decode-rs"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto       = true
strip     = true
