[package]
name = "dagtoml-validate-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Safe-Rust primary validator for DAG-TOML canonical examples, profiles, ontologies, kind descriptors, and semantic invariants. Python validators under validators/ are retained as cross-check references."
license = "Apache-2.0"
rust-version = "1.85"

# Dependencies are pure-Rust, no `unsafe`-using code in our crate.
# `toml` ships its own deny-list policy and is the de-facto TOML parser
# for Rust. `serde` is used only for Deserialize derives.
#
# TOML 1.1 (`toml` 1.1.x+spec-1.1.0, mirroring tools/dagtoml-rdf). The 1.1
# line gates the `toml::Value` / `toml::value` API behind the `serde`
# feature (it was reachable under `parse` alone in 0.8), so we enable
# `serde` in addition to `parse`. Safe-tools posture is preserved: THIS
# crate keeps `#![forbid(unsafe_code)]` (checked by
# validators/check_safe_tools.sh). Per that policy, transitive parser
# crates may use `unsafe` internally and are out of scope — e.g. `winnow`
# (bumped 0.7→1.0 by the 1.1 line) already carried internal `unsafe`
# under the 0.8 `toml_edit` stack, so no new dependency `unsafe` surface
# is introduced here.
[dependencies]
toml  = { version = "1.1", default-features = false, features = ["parse", "serde"] }
serde = { version = "1",   default-features = false, features = ["derive", "alloc"] }
sha2  = { version = "0.11", default-features = false }

[[bin]]
name = "dagtoml-validate-rs"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto       = true
strip     = true
