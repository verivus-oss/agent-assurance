# golangci-lint v2 config for every Go module under tools/*-go.
#
# Consumed by the "Go meta-linter (golangci-lint...)" steps in
# .github/workflows/validate.yml.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Security
    - gosec        # security checks (G101 hardcoded creds, G304 path
                   # traversal, G404 weak RNG, G501-G505 weak crypto, etc.)
    # Correctness
    - errcheck     # unchecked errors
    - govet        # vet rules
    - ineffassign  # ineffectual assignments
    - staticcheck  # static analysis (dead code, API misuse, bug patterns)
    - unused       # unused vars/funcs/types

  settings:
    gosec:
      # Default settings cover G101..G505. Exclude G104 (errors not
      # checked) — errcheck already covers it and gosec G104 emits
      # duplicates.
      excludes:
        - G104
        # G115 (integer overflow conversion): too noisy on TOML int
        # parsing where we know values fit. Re-enable if needed.
        - G115

    staticcheck:
      # Enable everything except the QF (quickfix) family. Per
      # staticcheck's own docs the QF rules are stylistic IDE/editor
      # quickfix suggestions, not enforcement-grade checks, and are
      # not recommended for CI. The S (style) and SA (simple/advanced
      # static analysis) families remain enforced.
      #
      # Concrete example we hit on 2026-05-27: QF1001 ("could apply
      # De Morgan's law") fires bidirectionally — both `!(a || b)` and
      # `!a && !b` trigger it, so applying the rule's suggested
      # rewrite just bounces the warning to the other form. The
      # function the rule flagged (isLowerHex in
      # tools/dagtoml-validate-go/main.go) is correct in either form;
      # there is no validator-semantic change to make.
      checks: ["all", "-QF1001"]

  exclusions:
    presets:
      - common-false-positives
    paths:
      - vendor
