# ============================================================================
# Provenance encryption sub-table (SPEC §11.1)
# ============================================================================

[[contracts]]
id          = "C14"
domain      = "provenance-encryption-shape"
statement   = "SPEC §11.1 defines an optional `[provenance.encryption]` sub-table with REQUIRED fields `sealed = true` (boolean) and `hash_is_over` drawn from the closed set `plaintext | ciphertext`, plus an OPTIONAL free-form `scheme_hint`. The primary validators enforce the sub-table shape; both also reject the sub-table when `sealed = false`."
applies_to  = ["spec.md", "tools/dagtoml-validate-rs", "tools/dagtoml-validate-go"]
verified_by = [
  "spec.md §11.1 (closed sets + field semantics)",
  "tools/dagtoml-validate-rs/src/main.rs (validate_provenance_encryption + HASH_IS_OVER)",
  "tools/dagtoml-validate-go/main.go (validateProvenanceEncryption + hashIsOverClosed)",
  "core/ontology.toml ([[attribute_vocabularies]] with attribute = \"provenance.encryption.hash_is_over\")",
]

