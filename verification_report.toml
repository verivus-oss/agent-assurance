id          = "C18"
domain      = "ijb-attribute-vocab-types"
statement   = "SPEC §10.2 permits `ijb_constraint_type` to be `structural | policy | observed` on `[[attribute_vocabularies]]` blocks (declared posture vocabularies use `policy`). `validators/validate_ijb_conformance.py` enforces this relaxed rule and still rejects any value outside the closed set."
applies_to  = ["spec.md", "validators/validate_ijb_conformance.py"]
verified_by = [
  "spec.md §10.2 (the table row + the note that follows)",
  "validators/validate_ijb_conformance.py (attribute_vocabularies branch in validate_ontology)",
]

[[contracts]]
id          = "C19"
domain      = "meta-field-classification"
statement   = "`validators/validate_ijb_conformance.py` `_META_FIELD_MAP` includes confidentiality (constraint/policy), license (constraint/policy), embargo_until (time, no class field). `[meta.ijb_field_primitives]` MUST declare the annotation when the underlying field is present; the validator rejects unknown annotation keys."
applies_to  = ["validators/validate_ijb_conformance.py", "core/ontology.toml"]
verified_by = [
  "validators/validate_ijb_conformance.py (_META_FIELD_MAP and validate_ontology)",
