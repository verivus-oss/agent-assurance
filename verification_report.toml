id          = "C09"
domain      = "confidentiality-closed-set"
statement   = "SPEC §2.7 defines `confidentiality` as a closed set `public | restricted | confidential | trade-secret | embargoed`, declared in `core/ontology.toml` as an `[[attribute_vocabularies]]` entry with ijb_primitive=constraint, ijb_constraint_type=policy. The primary validators reject values outside that set."
applies_to  = ["spec.md", "core/ontology.toml", "tools/dagtoml-validate-rs", "tools/dagtoml-validate-go"]
verified_by = [
  "spec.md §2.7 (the bulleted vocabulary list)",
  "core/ontology.toml ([[attribute_vocabularies]] with attribute = \"confidentiality\")",
  "tools/dagtoml-validate-rs/src/main.rs (CONFIDENTIALITY constant + validate_meta_fields)",
  "tools/dagtoml-validate-go/main.go (confidentialityClosed + validateMeta)",
]

[[contracts]]
id          = "C10"
domain      = "embargo-cross-field"
statement   = "`confidentiality = \"embargoed\"` REQUIRES `[meta].embargo_until` (RFC 3339 string). All three primary validators enforce this cross-field rule; SPEC §2.7 declares it normatively."
applies_to  = ["spec.md", "tools/dagtoml-validate-rs", "tools/dagtoml-validate-go", "validators/validate_ijb_conformance.py"]
verified_by = [
  "spec.md §2.7 (embargo_until paragraph)",
  "tools/dagtoml-validate-rs/src/main.rs (validate_meta_fields embargoed branch)",
  "tools/dagtoml-validate-go/main.go (validateMeta embargoed branch)",
]

[[contracts]]
id          = "C11"
domain      = "license-free-form"
statement   = "`[meta].license` is free-form (SHOULD be SPDX or `LicenseRef-…`). Validators MUST NOT resolve license values against an external registry. The constraint declared on `license` in the ontology is `ijb_constraint_type = \"policy\"` (declared posture, not a structural vocabulary)."
applies_to  = ["spec.md", "core/ontology.toml"]
verified_by = [
  "spec.md §2.7 (license paragraph)",
  "core/ontology.toml ([[attribute_vocabularies]] with attribute = \"license\")",
]

[[contracts]]
id          = "C12"
domain      = "docs-url-shape"
statement   = "SPEC §2.6 requires `[meta].docs`, when set, to start with `https://` and not contain a query string. The primary validators enforce both rules."
applies_to  = ["spec.md", "tools/dagtoml-validate-rs", "tools/dagtoml-validate-go"]
verified_by = [
  "spec.md §2.6 (https:// and query-string paragraph)",
  "tools/dagtoml-validate-rs/src/main.rs (validate_meta_fields docs check)",
  "tools/dagtoml-validate-go/main.go (validateMeta docs check)",
]

