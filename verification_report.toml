[[contracts]]
id          = "C17"
domain      = "primary-vs-cross-check"
statement   = "CI builds the Rust + Go primary validators BEFORE running the Python validators. The Rust + Go validators run first against the new artifacts (profile descriptors + disclosure profile); the Python validators run as cross-checks afterwards. The CHANGELOG and SPEC describe Python as a `cross-check reference`, not the authority."
applies_to  = [".github/workflows/validate.yml", "CHANGELOG.md"]
verified_by = [
  ".github/workflows/validate.yml (Primary validators step + Cross-check step ordering)",
