# VERIFICATION REPORT — DAG-TOML draft layering bundle
#
# Format: a single `contract-declaration` (template_kind=contract-declaration)
# carrying one contract per item in the corrective-program spec the
# user supplied. Each `[[contracts]]` entry is the testable statement
# the multi-LLM review must verify against code and docs (NOT against
# this report's prose). The `verified_by` array points at the
# concrete artifacts the reviewer should inspect.
#
# This file is intentionally itself a DAG-TOML document so it parses
# under the same Taplo + tomllib + IJB CI pipeline as the rest of the
# spec.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[meta]
schema_version    = "0.1.0"
template_kind     = "contract-declaration"
docs              = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md"
title             = "Verification report for the draft layering bundle"
status            = "in_review"
created           = "2026-05-22"
review_subject    = "DAG-TOML Draft Specification layering bundle (this branch)"
confidentiality   = "public"
license           = "Apache-2.0"

[review]
verifier_must = """
For every contract below, verify the statement against the named
artifacts in `verified_by` by INSPECTING the artifacts directly
(reading the cited TOML / Rust / Go / Python source). Do NOT accept
this report's prose, the CHANGELOG entry, or the spec.md commit
message as evidence. If the cited artifact does not match the
contract statement, the contract MUST be flagged as a concrete
blocker, with the literal file path and line range that contradicts
the statement.

If Claude (the implementer) disagrees with a finding, Claude MUST
respond with the same shape: a file path and line range, not an
assertion. Approval MUST be based on inspected code, tests, and
docs — NOT on intent, plan compliance claims, or "should be fixed"
language.
"""

# ============================================================================
# Layering primitives (the four hard-to-retrofit additions)
# ============================================================================

[[contracts]]
id          = "C01"
domain      = "profile-descriptor-kind"
statement   = "A new template_kind `profile-descriptor` exists, is listed in SPEC §2.3, is documented normatively in SPEC §6.1, and is described by a kind-descriptor at `core/profile-descriptor-kind.toml` whose `[meta].describes_kind = \"profile-descriptor\"`. The kind-descriptor declares required fields name/namespace/owner/license/extends/ontology/contained_kinds and hard invariants INV01..INV05 each with `enforced_by` pointing at `validators/validate_profile_descriptor.py`."
applies_to  = ["spec.md", "core/profile-descriptor-kind.toml"]
verified_by = [
  "spec.md (§2.3 table row, §6.1 prose + table)",
  "core/profile-descriptor-kind.toml ([meta], [kind], [[kind.required_fields]], [[kind.hard_invariants]])",
]

[[contracts]]
id          = "C02"
domain      = "namespace-partition"
statement   = "SPEC §2.5 partitions `framework_profile` values into (a) unprefixed kebab-case reserved for spec-reserved profiles in this repo, (b) reverse-DNS for everything else, (c) other shapes reserved. The partition is enforced by the primary validators: a profile-descriptor with name=`com.example.internal` and namespace=`spec.reserved` MUST be rejected; a profile-descriptor with an unprefixed name and namespace != `spec.reserved` MUST be rejected."
applies_to  = ["spec.md", "tools/dagtoml-validate-rs", "tools/dagtoml-validate-go", "validators/validate_profile_descriptor.py"]
verified_by = [
  "spec.md §2.5 (numbered partition list)",
  "tools/dagtoml-validate-rs/src/main.rs (mod profile::check_namespace_partition)",
  "tools/dagtoml-validate-go/main.go (checkNamespacePartition)",
  "validators/validate_profile_descriptor.py (check_namespace_partition)",
]

[[contracts]]
id          = "C03"
domain      = "extends-acyclic-and-resolvable"
statement   = "`[profile].extends` is declarative inheritance. The primary validators MUST reject (a) any extends entry not corresponding to a loaded profile-descriptor, (b) any cycle in the extends graph. Both checks share the same descriptor-discovery routine that walks `profiles/*/PROFILE.toml`."
applies_to  = ["tools/dagtoml-validate-rs", "tools/dagtoml-validate-go", "validators/validate_profile_descriptor.py"]
verified_by = [
  "tools/dagtoml-validate-rs/src/main.rs (mod profile::check_extends_acyclic, ::discover)",
  "tools/dagtoml-validate-go/main.go (checkExtendsAcyclic, discoverDescriptors)",
  "validators/validate_profile_descriptor.py (check_extends_acyclic, discover_descriptors)",
]

[[contracts]]
id          = "C04"
domain      = "contained-kinds-resolve-to-descriptors"
statement   = "Every entry of `[profile].contained_kinds` MUST resolve to a *-kind.toml under repo root whose `[meta].describes_kind` matches the entry verbatim. The validators search the conventional locations (profiles slash NAME slash, core slash, every other profiles entry) and reject unmatched entries."
applies_to  = ["tools/dagtoml-validate-rs", "tools/dagtoml-validate-go", "validators/validate_profile_descriptor.py"]
verified_by = [
  "tools/dagtoml-validate-rs/src/main.rs (profile::validate_one INV05 block, profile::kind_descriptor_candidates)",
  "tools/dagtoml-validate-go/main.go (kindDescriptorCandidates + the contained_kinds loop in validateProfileDescriptor)",
  "validators/validate_profile_descriptor.py (_kind_descriptor_candidates, INV05 block)",
]

[[contracts]]
id          = "C05"
domain      = "agent-assurance-profile-descriptor"
statement   = "`profiles/agent-assurance/PROFILE.toml` exists, declares `template_kind = \"profile-descriptor\"`, `name = \"agent-assurance\"`, `namespace = \"spec.reserved\"`, `extends = []`, and lists all nine agent-assurance template kinds in contained_kinds: spec-contract, threat-model, smoke-validation, rollback-plan, adapter-contract, adapter-registry-binding, assertion-bundle, assertion-log-record, gate-decision."
applies_to  = ["profiles/agent-assurance/PROFILE.toml"]
verified_by = ["profiles/agent-assurance/PROFILE.toml"]

[[contracts]]
id          = "C06"
domain      = "disclosure-profile-shipped"
statement   = "`profiles/disclosure/` ships as a sibling of agent-assurance (NOT inside it) and contains: PROFILE.toml (template_kind=profile-descriptor, namespace=spec.reserved, extends=[]), ontology.toml (template_kind=ontology with [extension_rules]), and three *-kind.toml files (disclosure-attestation, redaction-manifest, selective-disclosure-proof). Three minimal examples ship under `examples/`."
applies_to  = ["profiles/disclosure/", "examples/minimal-disclosure-attestation.toml", "examples/minimal-redaction-manifest.toml", "examples/minimal-selective-disclosure-proof.toml"]
verified_by = [
  "profiles/disclosure/PROFILE.toml",
  "profiles/disclosure/ontology.toml",
  "profiles/disclosure/disclosure-attestation-kind.toml",
  "profiles/disclosure/redaction-manifest-kind.toml",
  "profiles/disclosure/selective-disclosure-proof-kind.toml",
  "examples/minimal-disclosure-attestation.toml",
  "examples/minimal-redaction-manifest.toml",
  "examples/minimal-selective-disclosure-proof.toml",
]

[[contracts]]
id          = "C07"
domain      = "disclosure-vocab-closure"
statement   = "The disclosure validators enforce closed-vocabulary membership for `disclosure_posture`, and (extensible) shape for `redaction_method`, `redaction_reason`, `proof_scheme` (extensible vocabularies still require a string value). The Rust + Go primary validators load the vocabularies from `profiles/disclosure/ontology.toml` at runtime so future additions are picked up automatically."
applies_to  = ["tools/dagtoml-validate-rs", "tools/dagtoml-validate-go", "validators/validate_disclosure.py"]
verified_by = [
  "tools/dagtoml-validate-rs/src/main.rs (mod disclosure::load_vocabs, ::check_vocab)",
  "tools/dagtoml-validate-go/main.go (loadDisclosureVocabs, checkVocab)",
  "validators/validate_disclosure.py (load_vocabularies, _check_vocab)",
]

[[contracts]]
id          = "C08"
domain      = "disclosure-cross-field-rules"
statement   = "All three primary validators enforce (a) `disclosure_posture = \"partial\"` REQUIRES at least one covered_by entry with a `RED:` prefix; (b) `disclosure_posture = \"embargoed\"` REQUIRES `[meta].embargo_until`; (c) `redaction_reason = \"other\"` REQUIRES a non-empty `notes` field; (d) selective-disclosure-proof `bound_source` MUST match `^sha256:[0-9a-f]{64}$`."
applies_to  = ["tools/dagtoml-validate-rs", "tools/dagtoml-validate-go", "validators/validate_disclosure.py"]
verified_by = [
  "tools/dagtoml-validate-rs/src/main.rs (mod disclosure::validate_attestation, ::validate_redaction, ::validate_proof, ::is_sha256_hex)",
  "tools/dagtoml-validate-go/main.go (validateAttestation, validateRedaction, validateProof, sha256RE)",
  "validators/validate_disclosure.py (validate_attestation, validate_redaction_manifest, validate_proof, SHA256_RE)",
]

