# Verivus runtime profile — ontology extension.
#
# Declares the attribute vocabularies the api-snapshot kind adds on top
# of the agent-assurance profile and the core DAG-TOML ontology. Carries
# its own `ontology_version` tracking ONLY this profile's vocabulary.
#
# MODELLING NOTE. An api-snapshot is a flat, single-subject observation
# record: one `[snapshot]` table describing one captured request/response
# interaction. That is the same shape as `gate-decision`, whose shipped
# kind descriptor declares `entities_introduced = []`. This profile
# follows that precedent: it introduces NO id-prefixed entities (no
# SNAP/SRC/WIT/ATT) and NO namespaced relations. The closure binding uses
# the CORE `cites_upstream` relation; the digest-algorithm set is the CORE
# `closure_root.digest_algorithm` vocabulary; the only thing this profile
# adds is two closed witness vocabularies. Verified against the graph/RDF
# (tools/dagtoml-rdf) and DuckDB (tools/dagtoml-duckdb) consumers: a flat
# record with zero entity prefixes maps to a single document-level
# node/row exactly as gate-decision does, so first-class snapshot nodes
# are unnecessary. If a deployment later wants snapshots to be first-class
# graph nodes, that is a separate, ontology_version-bumping design.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[meta]
schema_version = "0.1.0"
template_kind = "ontology"
docs = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md"
ontology_version = 2
framework_profile = "com.verivus.runtime"
title = "Verivus runtime profile ontology extension"
extends = "../agent-assurance/ontology.toml"
authoritative_in = "./PROFILE.toml"
confidentiality = "public"
license = "Apache-2.0"

# Per-field IJB primitive annotations for this [meta] table (SPEC §10.2).
# Required by validate_ijb_conformance.py: every annotation key must be a
# known §10.2 meta-field, and every classifiable [meta] field present here
# must carry one.
[meta.ijb_field_primitives]
framework_profile = { ijb_primitive = "scope", ijb_class = "structural" }
template_kind = { ijb_primitive = "scope", ijb_class = "structural" }
schema_version = { ijb_primitive = "constraint", ijb_constraint_type = "structural" }
ontology_version = { ijb_primitive = "constraint", ijb_constraint_type = "structural" }
confidentiality = { ijb_primitive = "constraint", ijb_constraint_type = "policy" }
license = { ijb_primitive = "constraint", ijb_constraint_type = "policy" }

# ============================================================================
# PROFILE-DEFINED ENTITIES
# ============================================================================
#
# None. An api-snapshot is a flat single-subject observation record (see the
# modelling note above); like gate-decision it introduces no id-prefixed
# entities. The captured artefact, source endpoint, witness, and attester are
# fields on the single `[snapshot]` subject, not separately-identified graph
# nodes at the SPEC layer.

# ============================================================================
# PROFILE-DEFINED RELATIONS
# ============================================================================
#
# None. The downstream-to-snapshot binding uses the CORE `cites_upstream`
# relation (core/ontology.toml), which is typed `unconstrained_label` on both
# sides precisely so the closure-root rule fires uniformly across profile kinds.
# A downstream document folds the snapshot's `provenance.source_sha256` (the
# captured-artefact digest) into its own `closure_root` per SPEC §12. This
# profile introduces no namespaced predicate; adding one later bumps
# ontology_version.

# ============================================================================
# PROFILE-DEFINED ATTRIBUTE VOCABULARIES
# ============================================================================

[[attribute_vocabularies]]
attribute = "witness_scheme"
applies_to = "api-snapshot"
values = ["tls-notary", "provider-signature", "tee-quote"]
extensible = false
notes = "Closed set on the [snapshot.witness].scheme field of an api-snapshot. `tls-notary` binds origin and content; `provider-signature` binds content and provider identity; `tee-quote` binds the measured capture environment. The SPEC layer records the choice only; signature/quote verification, key resolution, and freshness are RUNTIME-SPEC. `applies_to` names the schema (template_kind) rather than an id-prefix because the value lives on a singleton sub-table, mirroring how the core `closure_root.digest_algorithm` vocabulary applies to `document_root` and the agent-assurance `smoke.decision` vocabulary applies to the `smoke-validation` schema."
ijb_primitive = "constraint"
ijb_constraint_type = "structural"

[[attribute_vocabularies]]
attribute = "attester_observed"
applies_to = "api-snapshot"
values = ["request", "response", "both"]
extensible = false
notes = "Closed set on the [snapshot.witness].observed field. Bounds what a witnessed snapshot proves: an attester that saw only the response cannot witness the request descriptor, so `response` MUST NOT be read as covering request integrity. Applies only when [snapshot.witness].present is true."
ijb_primitive = "constraint"
ijb_constraint_type = "structural"

[[attribute_vocabularies]]
attribute = "execution_proof_scheme"
applies_to = "state-mutation"
values = ["ledger-transaction", "provider-receipt", "tee-quote", "zk-receipt"]
extensible = false
notes = "Closed set on the [execution_proof].scheme field of a state-mutation. `ledger-transaction` binds the mutation to a transaction on an external ledger; `provider-receipt` binds it to a counterparty-signed acknowledgement; `tee-quote` binds it to a measured execution environment; `zk-receipt` binds it to a verifiable-computation receipt. The SPEC layer records the choice and the digests, and enforces that a proof is present at all (RKM02). Verification of the proof itself, key and trust-root resolution, ledger inclusion, circuit and verification-key identity, and freshness are RUNTIME-SPEC. Which schemes are ACCEPTABLE for a given workflow is policy and belongs to the consuming conformance profile, not to this vocabulary: this profile fixes that a proof exists, not that any particular proof is strong enough. This distinction was contested in review and is stated deliberately. `provider-receipt` is materially weaker than the other three, and one reviewer argued for removing it on the grounds that a hashed counterparty acknowledgement can then satisfy a kind whose name asserts execution. It is retained because the SPEC layer verifies NO scheme, so removing the honest label for `counterparty said so` does not make weak evidence unrepresentable, it makes producers mislabel it as something stronger. The mitigations are that the scheme is a closed machine-readable token a policy engine can refuse, and that RKM06 forbids `provider-receipt` from claiming ledger finality. A consuming profile that wants cryptographic proof MUST require the scheme it wants; it MUST NOT infer strength from the presence of the table."
ijb_primitive = "constraint"
ijb_constraint_type = "structural"

[[attribute_vocabularies]]
attribute = "finality_basis"
applies_to = "state-mutation"
values = ["none", "provider-acknowledged", "ledger-confirmed", "ledger-final"]
extensible = false
notes = "Closed set on the [execution_proof].finality_basis field. Bounds what the record claims about the DURABILITY of the mutation, which the proof scheme alone does not establish: a ledger transaction hash evidences submission and inclusion, not settlement. `none` means the record evidences that the operation was executed and claims nothing about durability; `provider-acknowledged` means a counterparty accepted it; `ledger-confirmed` means included with some confirmations; `ledger-final` means final under the ledger's own finality rule. A consumer MUST NOT read any value above `none` as verified: the SPEC layer records the producer's claim, and checking it against the named ledger is RUNTIME-SPEC. The values are NOT a single linear scale, and RKM06 constrains which are legal per scheme, because durability claims are only meaningful from evidence that can carry them: `ledger-transaction` and `zk-receipt` may claim `none`, `ledger-confirmed` or `ledger-final`; `provider-receipt` may claim `none` or `provider-acknowledged` and can never assert ledger finality; `tee-quote` may claim only `none`, since attesting a measured execution environment says nothing about whether the effect persisted."
ijb_primitive = "constraint"
ijb_constraint_type = "structural"

# ============================================================================
# EXTENSION RULES (profile-scoped)
# ============================================================================

[extension_rules]
entity_kinds = "closed_within_profile"
relation_predicates = "must_be_namespaced_as_com.verivus.runtime:"
version_bump_rule = "After the first public release, adding a profile entity or attribute value bumps this file's ontology_version. The core and agent-assurance ontology_versions are unaffected. Pre-publication, ontology_version stays at 1 while drafts are revised in place. A new digest algorithm is NOT a change here: digest formats are governed by the core `closure_root.digest_algorithm` vocabulary and the kind descriptor's digest field type, not by this profile."
ijb_primitive = "constraint"
ijb_constraint_type = "structural"
