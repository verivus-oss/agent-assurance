# Profile descriptor for the com.verivus.runtime profile.
#
# Authoritative machine-readable declaration of the reverse-DNS
# `com.verivus.runtime` profile per spec.md §6.1. A consumer that loads
# this descriptor sees every kind the profile introduces and the ontology
# it ships, without scanning the directory.
#
# Per spec.md §2.5 this is a NON-spec-reserved profile: its name is
# reverse-DNS (contains a dot), so `namespace` MUST be a strict reverse-DNS
# prefix of `name` ("com.verivus" for "com.verivus.runtime"), per
# validate_profile_descriptor.py INV01.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[meta]
schema_version    = "0.1.0"
template_kind     = "profile-descriptor"
ontology_version  = 1
title             = "Verivus Runtime Profile descriptor"
docs              = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md#61-the-profile-descriptor-kind"
confidentiality   = "public"
license           = "Apache-2.0"

[meta.ijb_field_primitives]
template_kind     = { ijb_primitive = "scope",      ijb_class = "structural" }
schema_version    = { ijb_primitive = "constraint", ijb_constraint_type = "structural" }
ontology_version  = { ijb_primitive = "constraint", ijb_constraint_type = "structural" }
confidentiality   = { ijb_primitive = "constraint", ijb_constraint_type = "policy" }
license           = { ijb_primitive = "constraint", ijb_constraint_type = "policy" }

[profile]
name              = "com.verivus.runtime"
namespace         = "com.verivus"
owner             = "verivus"
license           = "Apache-2.0"
extends           = []
ontology          = "profiles/com.verivus.runtime/ontology.toml"
contained_kinds   = [
  "api-snapshot",
  "state-mutation",
  "mutation-claim",
]
ijb_primitive     = "thing"
ijb_class         = "structural"

# Profile-pinned closure records (SPEC 12.8.1, INV07). These promote the
# api-snapshot component digests and the witness attestation digest into
# the closure stream, so component swaps and witness stripping change
# `closure_root` and cascade-break downstream citations.
[[profile.closure_records]]
contained_kind = "api-snapshot"
field          = "snapshot.request.descriptor_sha256"
presence       = "required"

[[profile.closure_records]]
contained_kind = "api-snapshot"
field          = "snapshot.response.body_sha256"
presence       = "required"

[[profile.closure_records]]
contained_kind = "api-snapshot"
field          = "snapshot.witness.attestation_sha256"
presence       = "when-present"

# state-mutation pins. Every one is `required`, unlike the api-snapshot
# witness above. A witness may legitimately be absent, so its record is
# when-present and an honestly re-rooted unwitnessed capture stays valid.
# An execution proof may NOT be absent (RKM02), so removing it does not
# produce a smaller valid stream: it removes a required pin and fails the
# closure gate in all three implementations. That is what makes a
# state-mutation impossible to downgrade silently by deletion.
[[profile.closure_records]]
contained_kind = "state-mutation"
field          = "mutation.authorization_sha256"
presence       = "required"

[[profile.closure_records]]
contained_kind = "state-mutation"
field          = "mutation.effect_sha256"
presence       = "required"

[[profile.closure_records]]
contained_kind = "state-mutation"
field          = "execution_proof.proof_sha256"
presence       = "required"

[[profile.closure_records]]
contained_kind = "state-mutation"
field          = "execution_proof.binds_sha256"
presence       = "required"

# SPEC 12.8.2 bound tuple for `state-mutation`. `execution_proof.binds_sha256`
# is the digest of the canonical stream over the fields named below, and the
# closure record above pins that digest.
#
# WHY THIS IS DECLARED HERE. The field set is compiled into all three
# implementations, and until this declaration existed it was named nowhere a
# machine could read: changing the tuple meant editing the Python reference,
# the Rust primary and the Go primary, with nothing comparing the three. The
# implementations still each carry their own copy, deliberately, because a
# tuple read from a producer-supplied descriptor could be shrunk by the
# producer, and because three independent encodings are what make a divergence
# detectable at all. This declaration is the fourth statement they are all
# checked against, by `validators/check_bound_tuple_drift.py`, on the same
# contract as the EXPECTED_COUNTS mirrors in `check_attribute_values.py`.
#
# Field ORDER here is not semantic. SPEC 12.8.2 sorts the records bytewise
# before hashing, so the digest depends on the set and its values, never on
# the order they are written in.
[[profile.bound_tuples]]
contained_kind = "state-mutation"
digest_field   = "execution_proof.binds_sha256"
fields = [
  "mutation.target_id",
  "mutation.operation",
  "mutation.authorization_sha256",
  "mutation.effect_sha256",
  "mutation.performed_at",
]

# mutation-claim pins. Three records, all required. There is no proof to
# pin: the absence of `[execution_proof]` is a kind-layer invariant (RKC02),
# since a closure stream can pin the presence of a field but never its
# absence.
[[profile.closure_records]]
contained_kind = "mutation-claim"
field          = "mutation.authorization_sha256"
presence       = "required"

[[profile.closure_records]]
contained_kind = "mutation-claim"
field          = "mutation.effect_sha256"
presence       = "required"
