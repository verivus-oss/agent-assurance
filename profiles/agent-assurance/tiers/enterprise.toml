# Deployment tier: enterprise.
# Self-contained `contract-declaration` instance. Strict superset of
# tier organization. See tiers/README.md for the ladder rationale.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[meta]
schema_version    = "0.1.0"
template_kind     = "contract-declaration"
docs          = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md"
confidentiality   = "public"
license           = "Apache-2.0"
framework_profile = "agent-assurance"
title             = "Deployment tier: enterprise"
status            = "ready"
created           = "2026-05-21"
review_subject    = "deployment-tier-enterprise"

[[contracts]]
id          = "C01"
domain      = "override_authority"
statement   = "Overrides on failed assertions MUST be authorized via combined RBAC, ABAC, and severity-scaled M-of-N signing thresholds. AIBAC operands MUST be tiered per the autonomy_tier vocabulary."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["authority_role", "signer_class", "severity_tier", "autonomy_tier"]
verified_by = ["adapter-contract:authority-check@1"]

[[contracts]]
id          = "C02"
domain      = "ai_agent_autonomy"
statement   = "AI agents MUST NOT be the sole signer of an override at any severity_tier. AI agents MAY produce evidence; final override decisions require a human signer."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["signer_class", "autonomy_tier"]
verified_by = ["adapter-contract:authority-check@1"]

[[contracts]]
id          = "C03"
domain      = "adapter_runtime_kind"
statement   = "Adapters used at this tier MUST declare runtime_kind=wasi-component where the toolchain permits. runtime_kind=oci-action is permitted only with an external-audit attestation recorded as a separate cited bundle."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["runtime_kind"]
verified_by = ["adapter-contract:runtime-kind-check@1"]

[[contracts]]
id          = "C04"
domain      = "merkle_log"
statement   = "Assertion log records MUST be witnessed by multiple independent operators with an M-of-N quorum on the evidence root. A single-witness log is forbidden."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["record_signature_algorithm", "registry_scheme"]
verified_by = ["adapter-contract:log-storage-check@1"]

[[contracts]]
id          = "C05"
domain      = "decision_signing_threshold"
statement   = "Gate decisions require a 3-of-7 signing threshold baseline. Regulator-bound artifacts MAY scale higher per the artifact's declared classification."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["override_decision_method", "severity_tier"]
verified_by = ["adapter-contract:signer-threshold-check@1"]

[[contracts]]
id          = "C06"
domain      = "replay_cadence"
statement   = "Adapter conformance fixtures MUST be re-run at gate evaluation time, nightly, on raw input hash change, AND quarterly by a third-party re-derivation party."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["adapter_id_derivation"]
verified_by = ["adapter-contract:replay-cadence-check@1"]

[[contracts]]
id          = "C07"
domain      = "registry_trust_anchors"
statement   = "Trust anchors backing adapter-registry-bindings MUST be co-signed by independent witnesses AND the root identity MUST be HSM-backed."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["registry_scheme"]
verified_by = ["adapter-contract:registry-trust-check@1"]

[[contracts]]
id          = "C08"
domain      = "audit_retention"
statement   = "Assertion bundles, gate decisions, and log records MUST be retained per applicable regulator (at least 7 years) with full chain-of-custody attestations."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["record_canonical_form"]
verified_by = ["adapter-contract:retention-check@1"]

[[contracts]]
id          = "C09"
domain      = "tier_downgrade"
statement   = "Downgrading a project from this tier is forbidden without an external attestation from an independent authority. RUNTIME-SPEC rejects downgrade events that lack the attestation."
applies_to  = ["deployment-tier-enterprise"]
must_name   = ["authority_role"]
verified_by = ["adapter-contract:tier-downgrade-check@1"]
