  "source Markdown path",
  "source content hash",
  "extracted intent",
  "extracted success criteria",
  "extracted constraints",
]
verified_by = ["TEST:convert-md-to-dag::traceability::source_hash_binds"]

[[contracts]]
id          = "C02"
domain      = "canonical_schema_and_serialization_shape"
statement   = "The canonical outputs MUST use current DAG-TOML template_kind values and MUST NOT use the deprecated [dag] / [[tasks]] draft shape."
applies_to  = ["convert-md-to-dag"]
must_name   = [
  "implementation-dag",
  "contract-declaration",
  "readiness-gate",
  "traceability",
  "rollback-plan",
]
verified_by = ["TEST:convert-md-to-dag::validators::canonical_shapes_pass"]

[[contracts]]
id          = "C03"
domain      = "review_gate_and_evidence"
statement   = "The package MUST keep the multi-LLM review gate blocked until at least three distinct model reviews are cited, or until tool unavailability is recorded as an explicit blocker."
applies_to  = ["convert-md-to-dag"]
must_name   = [
  "review model list",
  "review findings",
  "feedback disposition",
  "blocked reason when llm-cli-gateway is unavailable",
]
verified_by = ["TEST:convert-md-to-dag::review::multi_llm_evidence_recorded"]

[[contracts]]
id          = "C04"
domain      = "claim_refutability"
statement   = "Every structural claim SHOULD be paired with an observed instance where the source Markdown provides enough evidence to do so."
applies_to  = ["convert-md-to-dag"]
must_name   = [
  "structural claim",
  "observed instance",
  "explicit evidence gap when no observed instance exists",
]
verified_by = ["TEST:convert-md-to-dag::traceability::claims_have_evidence"]

[[contracts]]
id          = "C05"
domain      = "source_provenance"
statement   = "Every generated TOML artifact MUST include a [provenance] table with the original Markdown path, SHA-256 hash, byte count, capture time, extraction method, and source description."
applies_to  = ["convert-md-to-dag"]
must_name   = [
  "source_path",
  "source_sha256",
  "source_bytes",
  "captured_at",
  "extraction_method",
  "source_description",
]
verified_by = ["TEST:convert-md-to-dag::provenance::all_toml_files_bind_source"]
