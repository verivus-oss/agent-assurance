  "CODE:skills/convert-md-to-dag/contract_declaration.toml",
  "CODE:skills/convert-md-to-dag/review_readiness.toml",
]
tests         = ["TEST:convert-md-to-dag::validators::canonical_shapes_pass"]

[[implementations]]
