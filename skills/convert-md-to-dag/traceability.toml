[[intents]]
id           = "INT:governed-markdown-conversion"
name         = "Governed Markdown conversion"
statement    = "Agents can convert existing Markdown process guidance into reviewable DAG-TOML artifacts without losing the source intent."
realized_by  = [
  "REQ:preserve-source-intent",
  "REQ:emit-canonical-dag-toml",
  "REQ:capture-source-provenance",
  "REQ:require-multi-llm-review",
]

[[requirements]]
id               = "REQ:preserve-source-intent"
statement        = "The conversion MUST extract and preserve the source Markdown purpose, success criteria, constraints, edge cases, and assumptions."
requirement_kind = "functional"
priority         = "must"
source           = "skills/convert-md-to-dag/SKILL.md#process"
constrains       = ["IMP:analyze-source-markdown"]
verified_by      = ["TEST:convert-md-to-dag::traceability::source_hash_binds"]

[[requirements]]
id               = "REQ:emit-canonical-dag-toml"
statement        = "The conversion MUST emit canonical DAG-TOML instance files rather than the older [dag] / [[tasks]] draft shape."
requirement_kind = "correctness"
priority         = "must"
source           = "skills/convert-md-to-dag/SKILL.md#canonical-outputs"
constrains       = ["IMP:generate-canonical-package"]
verified_by      = ["TEST:convert-md-to-dag::validators::canonical_shapes_pass"]

[[requirements]]
id               = "REQ:capture-source-provenance"
statement        = "Every generated TOML artifact MUST record the original Markdown source path, SHA-256 hash, byte count, capture time, extraction method, and source description in a [provenance] table."
requirement_kind = "audit"
priority         = "must"
source           = "skills/convert-md-to-dag/SKILL.md#required-provenance"
constrains       = ["IMP:generate-canonical-package"]
verified_by      = ["TEST:convert-md-to-dag::provenance::all_toml_files_bind_source"]

[[requirements]]
id               = "REQ:require-multi-llm-review"
statement        = "The final package MUST include evidence from at least three distinct LLM reviewers, or keep the readiness gate blocked with a concrete unavailable-tool reason."
requirement_kind = "process"
priority         = "must"
source           = "skills/convert-md-to-dag/SKILL.md#multi-llm-review-command"
constrains       = ["IMP:perform-review-gate"]
verified_by      = ["TEST:convert-md-to-dag::review::multi_llm_evidence_recorded"]

[[implementations]]
id            = "IMP:analyze-source-markdown"
name          = "Analyze source Markdown"
summary       = "Read the complete Markdown input and extract purpose, constraints, assumptions, edge cases, and success criteria."
implements    = ["REQ:preserve-source-intent"]
code          = ["CODE:skills/convert-md-to-dag/SKILL.md"]
tests         = ["TEST:convert-md-to-dag::traceability::source_hash_binds"]

[[implementations]]
id            = "IMP:generate-canonical-package"
name          = "Generate canonical DAG-TOML package"
summary       = "Produce implementation DAG, contracts, readiness, traceability, rollback, and threat-model files using current template_kind shapes."
implements    = ["REQ:emit-canonical-dag-toml", "REQ:capture-source-provenance"]
