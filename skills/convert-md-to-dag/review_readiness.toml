# Review readiness gate for the convert-md-to-dag skill.

# SHA-256 over the SPEC §12.8 source-hash closure stream.
closure_root = "sha256:f9fb8ccb9b178fc6bf53ae33f259bf9d451b896f01490c5f79b519de84b52a93"

[meta]
schema_version = "0.1.0"
template_kind  = "readiness-gate"
docs           = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md"
title          = "Review readiness: convert Markdown to DAG-TOML"
status         = "blocked"
created        = "2026-05-21"
review_subject = "convert-md-to-dag"

[provenance]
source_path        = "skills/convert-md-to-dag/SKILL.md"
source_sha256      = "sha256:588c0afa76c35363ca01a9574f72aa66f3e968926eeb8781b00a8b9736d124b8"
source_bytes       = 3077
captured_at        = "2026-05-21T11:20:00Z"
extraction_method  = "manual-analysis"
source_description = "Skill instructions for converting Markdown files into governed DAG-TOML packages."

[[artifact_classes]]
id          = "A01"
name        = "governed_conversion_package"
description = "A set of DAG-TOML files generated from one source Markdown file."

[[artifact_classes]]
id          = "A02"
name        = "multi_llm_review_evidence"
description = "Review outputs from at least three distinct LLM models, or an explicit blocker when the gateway is unavailable."

[[gates]]
id                 = "G01"
artifact_class     = "A01"
name               = "Canonical package completeness"
purpose            = "Block review until the conversion package contains the required canonical DAG-TOML artifacts."
required_documents = [
  "implementation_dag.toml",
  "contract_declaration.toml",
  "review_readiness.toml",
  "traceability.toml",
  "rollback_plan.toml",
]
required_links     = [
  "traceability.toml links to the original Markdown source path",
  "contract_declaration.toml contracts are verified by traceability TEST entries",
  "implementation_dag.toml units produce the declared final output",
  "each generated TOML file contains a [provenance] table",
]
pass_conditions    = [
  "all required files exist and are non-empty",
  "all TOML files parse",
  "implementation DAG, contract declaration, readiness gate, and traceability validators pass",
  "every generated TOML artifact cites the same source Markdown path and SHA-256 hash",
]
block_conditions   = [
  "required canonical file is missing",
  "output uses deprecated [dag] or [[tasks]] shape",
  "traceability lacks source path or source hash",
  "any generated TOML artifact omits source provenance",
]
next_step = "complete the canonical package before requesting review"

[[gates]]
id                 = "G02"
artifact_class     = "A01"
name               = "Fidelity and governability"
purpose            = "Block review until the original Markdown intent is preserved in refutable, reviewable claims."
required_documents = [
  "traceability.toml",
  "contract_declaration.toml",
  "review_readiness.toml",
]
required_links     = [
  "intent maps to at least one requirement",
  "requirement maps to implementation, code, test, or output",
  "contracts name concrete verification evidence",
]
pass_conditions    = [
  "core intent of the original Markdown is preserved",
  "every claim is specific and refutable",
  "supervisor can meaningfully approve, reject, or request rollback",
  "structural claims have observed instances where the source provides them",
]
block_conditions   = [
  "conversion invents behavior not present in the source without marking it as an assumption",
  "success criteria are vague or not testable",
  "governance files contain generic claims without evidence hooks",
]
next_step = "tighten claims and traceability until each important assertion is reviewable"

[[gates]]
id                 = "G03"
artifact_class     = "A02"
name               = "Multi-LLM review passed"
purpose            = "Block finalization until independent model critique has been obtained and dispositioned."
required_documents = [
  "traceability.toml",
  "review_readiness.toml",
]
required_links     = [
  "at least three distinct LLM review outputs are cited",
  "all major feedback is addressed or explicitly rejected with reasoning",
  "review criteria match this readiness gate",
]
pass_conditions    = [
  "at least three different LLMs have reviewed the package",
  "all major feedback has been addressed or explicitly rejected with reasoning",
  "traceability link to original Markdown file is present and verifiable",
  "all structural claims have corresponding observed instances where applicable",
]
block_conditions   = [
  "llm-cli-gateway is unavailable and no review evidence exists",
  "fewer than three distinct models reviewed the package",
  "review feedback is not dispositioned",
]
next_step = "run llm-cli-gateway review or record the missing gateway as an explicit blocker"
