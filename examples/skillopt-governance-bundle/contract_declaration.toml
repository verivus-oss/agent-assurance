# Contract declaration: the testable contracts the optimized skill artifact is held to.
# [provenance] pins the same skill bytes as the evidence matrix, so both attestations
# share one closure root and break together if the skill is re-trained.

closure_root = "sha256:9faf62ae33d90001d9a54eda60c681f8bb8947fe72319d1abdca92933d5fc6c1"

[meta]
schema_version = "0.1.0"
template_kind = "contract-declaration"
docs = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md"
confidentiality = "public"
license = "Apache-2.0"
title = "Contracts: SkillOpt SpreadsheetBench / GPT-5.5"
status = "draft"
created = "2026-06-04"
review_subject = "skillopt-spreadsheetbench-gpt55"

[provenance]
source_path = "examples/skillopt-governance-bundle/skills/spreadsheetbench/best_skill.md"
source_sha256 = "sha256:8c50a5aa19e00e6efa275a52a40a129e54b9fa795457a432595f15df39535590"
source_bytes = 849
captured_at = "2026-06-04T02:40:00Z"
extraction_method = "agent-conversion"
source_description = "Deployed best_skill.md the contracts below constrain."

[[contracts]]
id = "C01"
domain = "deployment_inference_cost"
statement = "The exported skill MUST add zero optimizer-model calls at inference; only the frozen target model is invoked when the skill is deployed."
applies_to = ["skillopt-spreadsheetbench-gpt55"]
must_name = ["which model is called at inference", "where optimizer calls occur (training only)"]
verified_by = ["TEST:deploy::no_optimizer_calls_at_inference"]

[[contracts]]
id = "C02"
domain = "update_acceptance_gate"
statement = "A candidate skill MUST be accepted only when its held-out selection score is strictly greater than the incumbent; ties MUST be rejected."
applies_to = ["skillopt-spreadsheetbench-gpt55"]
must_name = ["selection metric", "strict-greater tie-break rule"]
verified_by = ["TEST:gate::strict_improvement_only"]

[[contracts]]
id = "C03"
domain = "provenance_fidelity"
statement = "Each attestation MUST pin the exact skill bytes it certifies; a change to the skill MUST flip the attestation closure root."
applies_to = ["skillopt-spreadsheetbench-gpt55"]
must_name = ["source_sha256 binding", "cascade-break on change"]
verified_by = ["TEST:provenance::source_sha256_matches"]

[[contracts]]
id = "C04"
domain = "artifact_compactness"
statement = "The deployed skill MUST remain human-auditable; target size under 2,000 tokens."
applies_to = ["skillopt-spreadsheetbench-gpt55"]
must_name = ["token budget", "audit expectation"]
verified_by = ["TEST:skill::token_budget_under_2000"]

[[contracts]]
id = "C05"
domain = "verifier_independence"
statement = "When a skill edit is adjudicated as self-modification, the deciding model MUST differ from the proposing model in BOTH provider and model family."
applies_to = ["skillopt-spreadsheetbench-gpt55"]
depends_on = ["C02"]
must_name = ["proposing identity", "deciding identity", "provider-and-family inequality"]
verified_by = ["TEST:gate::cross_provider_attribution"]
