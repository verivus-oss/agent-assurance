# Gate decision for a SINGLE accepted skill edit (epoch 3).
# In SkillOpt the gate fires when a candidate skill's held-out selection score
# is STRICTLY greater than the incumbent. That maps onto gate-decision exactly:
# verdict = "pass" iff no failed constraint (INV01). Here selection rose 0.742 -> 0.789.
#
# subject_class = "self-modification": editing the skill IS modifying the agent's
# own trainable state. INV06 then REQUIRES the deciding model to differ from the
# proposing model in BOTH provider and family. Modeled here as the GOVERNED form:
# optimizer (proposer) = openai/gpt; an INDEPENDENT verifier (decider) = anthropic/claude
# re-scores the selection split. SkillOpt's published same-model optimizer would FAIL
# this gate — that gap is the collaboration's value-add.

