[[contracts]]
id          = "C01"
domain      = "canonical_schema_and_serialization_shape"
statement   = "If a paid receipt is rendered, a 'Tax' line MUST appear, even when tax is zero. The line MUST use the same currency as item amounts."
applies_to  = ["checkout-tax-line"]
must_name   = [
  "currency normalisation rule",
  "behaviour when tax amount is zero",
]
verified_by = ["TEST:checkout::receipt::shows_tax_line"]

[[contracts]]
id          = "C02"
domain      = "precedence_override_and_waiver"
statement   = "Manual receipt adjustments MUST NOT remove the tax line; they MAY adjust its amount only via a recorded waiver."
applies_to  = ["checkout-tax-line"]
must_name   = ["who can issue a waiver", "waiver record format"]
verified_by = ["TEST:checkout::receipt::manual_adjustment_keeps_tax_line"]
