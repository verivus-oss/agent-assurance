#
# closure_root is the SPEC 12.8 stream over the five records this profile
# pins for the kind (provenance.source_sha256, mutation.authorization_sha256,
# mutation.effect_sha256, execution_proof.proof_sha256,
# execution_proof.binds_sha256). All five are pinned `required`, so removing
# the execution proof does not yield a smaller valid stream: it fails the
# closure gate. Every digest below is independently recomputable, and
# execution_proof.binds_sha256 is recomputable from this document's own
# fields (RKM04).

