# NEGATIVE FIXTURE: MUST be rejected by the kind layer in all three
# implementations for RKC02.
#
# The sibling of `mutation-claim-with-proof.toml`, and the reason RKC02 must
# test PRESENCE rather than well-formedness. The proof material is identical;
# only its TOML shape differs. It sits in an array of tables rather than a
# table, so an implementation that enforces RKC02 by asking "is
# `execution_proof` a table?" never sees it.
#
# The Go primary
# enforced RKC02 through its table accessor, which answers false both for an
# absent key and for a key holding a non-table, so this document passed Go in
# both auto and explicit mode while Python and Rust rejected it. The document
# is deliberately closure-VALID, so nothing else catches it: a Go-only consumer
# accepted a claim carrying a fully populated provider receipt.
#
# This is the same class as the blank-scheme and wrong-typed-proof fixtures,
# one structural level up. Those closed "present scalar that reads as empty";
# this closes "present key that reads as no table".
#
# Secondary: source_bytes is deliberately wrong (225; the capture is 224), per
# the examples/negative/ convention that every fixture here also fails
# validate_provenance.py. source_bytes is NOT a pinned closure record, so this
# does not disturb closure_root and the fixture still fails for its stated
# reason at the kind layer.

closure_root = "sha256:f7aeefffc2ab795ba9e6003b5f2d326a23a952e449f4dd2ab677afc17ed41bb8"

execution_proof = [
  { scheme = "provider-receipt", finality_basis = "provider-acknowledged", proof_sha256 = "sha256:a5255188d6a0efd927a7bca54ac504bd3f1908fe76e75b6be3e50568d7bc38ba", binds_sha256 = "sha256:7a5604ab843c08b4c79b19ab7d6ca1b118387b1ca096948e5ff86c5d2d3fda87", proof_locator = "https://crm.example/receipts/R-1" },
]

