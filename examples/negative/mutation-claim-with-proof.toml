# NEGATIVE FIXTURE: MUST be rejected by the kind layer in all three
# implementations for RKC02.
#
# The document declares template_kind = "mutation-claim" while carrying an
# [execution_proof] table. That is forbidden in this direction as well as the
# other: a proved record must not escape RKM02, RKM04 and RKM06 by calling
# itself a claim, and a claim must not borrow the appearance of proof. The
# closure layer cannot see this, because a stream can pin the presence of a
# field but never its absence, so it is a kind-layer rejection by design.
