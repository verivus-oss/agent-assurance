# Negative fixture — gate-decision separation-of-duty boundary.
#
# `verdict = "pass"` together with a non-empty `failed_constraint_refs`
# violates INV01 (verdict == "pass" iff failed_constraint_refs is empty).
# Here the refs are an array of STRINGS, not tables, which also violates
# INV02 (each entry must be a table with a constraint_id).
#
# This fixture pins a cross-implementation boundary: before the Go
# validator counted the raw array, `gdAsTableArray` silently dropped the
# string elements, so Go saw zero refs and ACCEPTED this "pass" verdict
# while Rust and the Python reference REJECTED it. All three MUST now
# reject it. See docs/reviews/2026-05-30-wp1-falsification/.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
