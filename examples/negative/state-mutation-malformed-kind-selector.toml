# NEGATIVE FIXTURE: MUST be rejected by the CLOSURE layer in all three
# implementations, for a malformed kind selector (SPEC 2.3).
#
# This is the deepest form of the collapse the earlier fixtures chased: not a
# field inside a kind, but the selector that
# decides which kind's rules apply at all.
#
# `template_kind = 1` is not a string. Every kind-layer validator dispatches on
# that value and correctly concludes "not my kind", so RKM02, RKM03, RKM04 and
# RKM06 never run. Closure pin resolution read the same malformed value as
# ABSENT and returned no pins AND no error, silently degrading the document to
# the SPEC 12.8 one-record source-hash closure. `closure_root` below is the
# honest one-record root for that degraded stream, so before the fix this file
# passed closure, provenance, and the kind layer in all three implementations
# while carrying a hollow `[execution_proof]` with no scheme, no finality and
# no locator.
#
# The distinction that makes this a defect rather than a design choice is
# narrow and load-bearing. SPEC 12 explicitly ratifies TWO escapes from
# conformance scope: a non-spec-reserved `template_kind` string, and no
# `template_kind` at all. Both remain legal and are asserted as such in CI. A
# value that is PRESENT but not a string is neither of those. SPEC 2.3 says
# `template_kind` IS a string, so this document is malformed, and a malformed
# selector must not be read as an absent one.
#
# Secondary: source_bytes is deliberately wrong (417; the capture is 416).

