# NEGATIVE FIXTURE: MUST be rejected by all three implementations for RKM03
# (value grammar), on `mutation.performed_at` alone.
#
# `2026-99-26T10:15:00Z` has the right shape and cannot name any instant: month
# 99 does not exist. A digit-position check accepts it, which is what the three
# implementations previously did.
#
# This matters more than a stray malformed field because `performed_at` is a
# member of the RKM04 bound tuple and carries the freshness claim. Binding an
# impossible instant into the tuple means the external proof commits to a time
# no verifier can order against anything.
#
# `binds_sha256` and `closure_root` are RECOMPUTED for this timestamp, so RKM04
# and the closure layer both pass and the grammar is the only thing that can
# reject the file. A fixture that fails for two reasons does not demonstrate
# either of them.
#
# Secondary: source_bytes is deliberately wrong (417; the capture is 416).

