# gitleaks configuration.
#
# Consumed by the "Secret scan (gitleaks)" step in
# .github/workflows/validate.yml, which runs `gitleaks detect --source .`
# with this file passed explicitly as its configuration.
#
# Exact historical false positives are checked after Gitleaks emits its
# findings, by validators/check_secret_scan.py. This configuration contains
# no authored pattern that could suppress a new credential finding.

# WITHOUT THIS BLOCK gitleaks REPLACES its default rule set with the rules in
# this file, of which there are none, and then reports no leaks on any input.
# A secret scan that cannot fail is worse than none. The CI step plants a
# credential and requires Gitleaks to report it before scanning history.
[extend]
useDefault = true
