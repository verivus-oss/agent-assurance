# Conformance case: an unwitnessed snapshot. The when-present pinned
# record (snapshot.witness.attestation_sha256) is absent, so the stream
# is the three-record form and this root MUST be accepted by all three
# implementations (frozen parity-matrix row: when-present absent).

closure_root = "sha256:627490aebb92bc8f5a4611dfe5ad763df1ce4980599bffb3baf4d8ba3eb5c3a6"

[meta]
