framework_profile = "com.verivus.runtime"
docs = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md"
confidentiality = "restricted"

[provenance]
source_path = "examples/captures/2026-06-17T091402Z-usd-aud.capture"
source_sha256 = "sha256:1af17db5085faf2b3078538922f462ed9a37ee3b8e0d0b11d5aa34276442eab7"
source_bytes = 620

[snapshot]
captured_at = "2026-06-17T09:14:02.481Z"
source_id = "https://api.exchange.example/v1/quotes/USD-AUD"

[snapshot.request]
method = "GET"
url = "https://api.exchange.example/v1/quotes/USD-AUD?asof=2026-06-17T09:14:00Z&pair=USD-AUD"
significant_headers = ["accept"]
descriptor_sha256 = "sha256:1e84dff27040181e39a0eedd71497241ae153efb65ec93e4b97303a8cb041869"
auth_context = "oauth2-client-credentials; client=verivus-quote-reader"

[snapshot.response]
status = 200
body_sha256 = "sha256:569cc4222c936a5c39184bc0e17048c3f80bed44d457f0327db1bd58faecfebd"

# An unwitnessed capture ASSERTS the absence of a witness (RKV03 requires
# `present`); it does not delete the table. `present` is not a pinned closure
# record, so the stream is still the three-record form and this root is
# unchanged: the frozen parity-matrix row is about the STREAM, not about the
# table's existence.
[snapshot.witness]
present = false
