# NEGATIVE (RKV03: `snapshot.witness.present` is not a boolean).
#
# `present = "true"` is the string, not the boolean. All three implementations
# already reject it, and until this case existed NOTHING tested that: every
# fixture in the corpus used a real boolean, so disabling the type check in
# Python, Rust or Go changed no verdict and the shipped oracle stayed green.
# Round-2 cross-LLM review found it as a mutation survivor.
#
# Why the type check matters rather than being pedantry: `present` is the field
# a policy engine filters on to refuse producer-only evidence. A truthy string
# that no implementation validates is exactly how a downgrade would slip past a
# consumer that trusts the field's shape.
#
# Deliberately closure-VALID: `present` is not a pinned closure record, so the
# four-record root below is unchanged from the witnessed valid case and the
# closure layer has nothing to say.

