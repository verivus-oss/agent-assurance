# NEGATIVE (RKV01: sub-part inconsistency, honestly re-rooted).
#
# `descriptor_sha256` does not match the request-descriptor sub-part embedded
# in the committed capture, and the document has been RE-ROOTED so the closure
# stream folds the wrong digest correctly. That is what makes this case worth
# having: the SPEC 12.8 gate is satisfied, every digest is well formed, and
# only a validator that opens the capture and recomputes the sub-part can tell
# the document is lying about what it captured.
#
# examples/negative/api-snapshot-bad-subpart-digest.toml documents the same
# defect but is deliberately double-defective (its source_bytes is wrong too,
# so it also fails the provenance-negative sweep). A primary that checked only
# source_bytes would reject it for the wrong reason and still look green. This
# fixture removes that escape.
closure_root = "sha256:f45e6b9cce5516428fd44757385fc2561a92e82ac99dec74654cae1a1cd106ec"

