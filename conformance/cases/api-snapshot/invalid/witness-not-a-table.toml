# NEGATIVE (RKV03: `snapshot.witness` present but not a table).
#
# `witness = "present"` is a string where a table is required. Every fixture
# supplied either a real table or nothing at all, so this branch was UNPROTECTED.
# Found by conformance/coverage_audit.py.
#
# The branch exists so a present-but-wrong-typed element is never reported as an
# absent one, the same rule SPEC 12.8.2 states for bound-tuple members.
# Collapsing the two would let a producer supply a truthy scalar and have the
# document read as honestly unwitnessed.
#
# Closure-VALID: with no witness table there is no attestation record, so the
# three-record root below is the honest one.

