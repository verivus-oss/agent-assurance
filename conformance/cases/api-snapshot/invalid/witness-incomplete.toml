# NEGATIVE (RKV03: a witness that claims presence without carrying it).
#
# `present = true` with no `attester_id` and no `observed`. The attestation
# digest IS present, so the four-record closure stream is complete and honest:
# the document is closure-VALID and only the kind layer sees that the witness
# block cannot support the claim it makes.
#
# The inverse case is witness-stripped.toml, where the witness is honestly
# removed and the CLOSURE layer catches the changed stream. The pair is the
# point: presence is a closure concern, completeness is a kind concern.
