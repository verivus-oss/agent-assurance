# NEGATIVE (RKV01: sub-part inconsistency on the RESPONSE BODY half).
#
# The sibling case subpart-descriptor-mismatch.toml corrupts the request
# descriptor. This one corrupts `snapshot.response.body_sha256` and leaves the
# descriptor correct, so the two halves of RKV01 are covered independently.
#
# This case exists because round-2 cross-LLM review found the body comparison
# was a MUTATION SURVIVOR in all three implementations. Every api-snapshot
# fixture in the corpus carried the correct `body_sha256`, so disabling the
# body comparison in Python, Rust or Go changed no verdict anywhere and the
# shipped oracle stayed green. Half an invariant was enforced by code that
# nothing tested.
#
# Deliberately closure-VALID: `body_sha256` is a pinned closure record, so the
# document is honestly RE-ROOTED over the corrupted value. The closure layer
# therefore has nothing to say and only the kind layer objects.

