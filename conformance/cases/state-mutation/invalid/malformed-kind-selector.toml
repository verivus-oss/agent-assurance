# Conformance case: the kind selector is not a string. MUST be REJECTED, at
# the CLOSURE layer.
#
# The deepest form of the collapse the review series chased: not a field
# inside a kind, but the selector deciding
# which kind's rules apply at all. Every kind validator dispatches on this
# value and correctly says "not my kind", so RKM02/03/04/06 never run. Pin
# resolution read the malformed value as ABSENT and returned no pins AND no
# error, degrading the document to the one-record source-hash closure written
# below. Before the fix this passed closure, provenance and the kind layer in
# all three implementations while carrying a hollow proof.
#
# SPEC §2.3 says `template_kind` IS a string, so this is neither of the two
# escapes SPEC §12 ratifies. Its two legal siblings are the valid/escape-hatch
# cases, and they must keep passing.

