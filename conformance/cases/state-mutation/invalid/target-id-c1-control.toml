# NEGATIVE (RKM03 value grammar: a C1 control character in target_id).
#
# U+0081 sits in Unicode category Cc but OUTSIDE the C0 range, so a character
# class written `[^\s\x00-\x1f\x7f]` lets it through while
# `char::is_control()` and `unicode.IsControl` reject it. That was a live
# three-way divergence: the Python reference accepted this document and both
# primaries rejected it, on a field that is a member of the RKM04 bound tuple.
#
# Deliberately bound and re-rooted: binds_sha256 folds the real target_id
# bytes and the closure root folds the real pins, so RKM04 and the closure
# layer both stay silent and the grammar is the only thing objecting.
closure_root = "sha256:d1e39170e51cf654e177b33ffb7bc08d31dd0dc95ca4c9ea59a0d6cb337d7d07"

