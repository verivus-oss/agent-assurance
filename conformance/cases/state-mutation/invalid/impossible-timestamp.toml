# Conformance case: a timestamp that cannot name an instant. MUST be
# REJECTED.
#
# Month 99. Found by the initiator's own differential run in round 2, by no
# reviewer: all four models differential-tested this grammar and all four
# tested its SHAPE rather than its meaning. `performed_at` is a member of the
# RKM04 bound tuple and carries the freshness claim, so an impossible instant
# was being bound into the proof. binds_sha256 and closure_root are recomputed
# so the grammar is the only thing that can reject this.

closure_root = "sha256:8fb971603175fa56c86e6c5f21ae775d1344d1fce84fc07345896eba9b11c918"

