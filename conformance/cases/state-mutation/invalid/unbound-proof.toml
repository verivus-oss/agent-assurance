# Conformance case: a real proof pointed at a different mutation. MUST be
# REJECTED.
#
# `binds_sha256` is a well-formed digest and a pinned closure record, and
# `closure_root` is recomputed over it, so the document is closure-VALID. It
# simply is not the SPEC §12.8.2 bound tuple of THIS document's fields. This is
# the invariant that stops a proof being reused across mutations.

