# Declared baseline for conformance/coverage_audit.py.
#
# `max_unprotected_checks` is the number of checks in the audited validators
# that no gate in this repository currently detects the removal of. It is a
# RATCHET: CI fails when the real number exceeds it, and the audit prints a
# note when the real number falls below it so the improvement can be locked in.
#
# THE CONTRACT, which is the same one `known-divergences.toml` and
# `TOML_CONFORMANCE_SKIPS` carry: this is a record of a known, bounded gap, not
# permission for it. Raising this number is a deliberate act that needs a reason
# stated here. Lowering it is the expected direction of travel.
#
# WHERE THE NUMBER CAME FROM
#
# The first audit run found 25 unprotected checks out of 45 across the two
# profile kind-layer validators, in a surface that had been inspected repeatedly
# with only a handful located that way. The gap is not
# 25 separate oversights: the corpus was built by mutating a single field of one
# known-good document, so every fixture inherits correct values everywhere else
# and any check on a commonly-correct field is structurally invisible.
#
# Closing all 25 at once would mean 25 hand-written fixtures landing without
# individual review, which is how the defects being closed got here. They are
# being closed in order of what an attacker could actually exploit: closed
# vocabularies first, then the fail-closed capture guards, then the shape and
# presence checks.

[coverage]
max_unprotected_checks = 19

# Rationale for the current value, updated whenever it moves.
note = """
Measured progression: 25 at the starting point, then 23, 21, and now 19 as gaps
were closed in order of what an attacker could exploit. Closed so far: the two
closed vocabularies (`witness.scheme`, `finality_basis`), the two RKV01
fail-closed capture guards, the significant_headers array shape, and the
wrong-typed witness table.

A STRUCTURAL LIMIT applies to most of what remains, and it is recorded here so
the number is not misread as 19 exploitable holes. The audit measures whether
deleting one `errors.append` changes any verdict. Many remaining checks are
required-field and presence checks that CO-OCCUR: removing `[snapshot.request]`
fires both the missing-table message and every check that depends on it, so
deleting any one of those messages still leaves the document rejected. For those
the DEFECT is still caught and only the message precision is unprotected, which
is a regression-detection concern rather than a security one.

Driving this number to zero would mean inventing fixtures that isolate messages
which cannot occur alone. That would be optimising the metric rather than the
property, so it is deliberately not done. The remaining genuinely-isolatable
checks should be closed; the co-occurring ones should be left, and this note is
the reason.
"""

# The SPECIFIC checks currently unprotected, by stable message fingerprint.
#
# A count alone is FUNGIBLE: closing an easy check while opening a hard one
# leaves the number identical and the gate green. That is precisely the shape of
# gaming this file exists to prevent, so the audit compares the SET and fails on
# any identity that appears here without being recorded, even when the total is
# unchanged or lower.
