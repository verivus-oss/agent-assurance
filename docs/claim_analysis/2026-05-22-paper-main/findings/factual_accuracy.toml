suggested_fix         = """Rewrite as: 'All three reviewers issued unconditional approval on the bundle after iteration (Grok and Gemini in their first review round; Codex after two earlier rejections that surfaced the SUMMARY-undercount bug and the sandbox-incompatible worktree creation issue; see Acknowledgments for the full history).'"""
