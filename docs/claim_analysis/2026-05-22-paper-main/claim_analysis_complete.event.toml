[meta]
schema_version = "0.1.0"
template_kind  = "claim-analysis-event"
event          = "ClaimAnalysisComplete"
created        = "2026-05-22"

[event]
name       = "ClaimAnalysisComplete"
run_label  = "2026-05-22-paper-main"
