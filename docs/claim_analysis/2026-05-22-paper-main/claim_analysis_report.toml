# ============================================================================
# Roll-up
# ============================================================================

[totals]
total_findings    = 29
severity_counts   = { high = 1, medium = 12, low = 16 }
sections_with_issues = 5
sections_minor_only  = 2

[overall_assessment]
verdict     = "Minor revisions needed"
one_line    = "Manuscript is empirically careful and well sourced; one numeric contradiction (JPlag file-count direction) and a recurring spec-vs-bundle conflation require corrections; the rest is tightening."
detail      = """
The paper is a high-quality empirical-methodology manuscript with
unusually strong cross-checking between body claims and the
accompanying proof bundle. Of 29 findings raised, 1 is high
severity, 12 medium, and 16 low.

The single high-severity finding (F2-F01) is a localised numeric
contradiction in §sec:related-tools: the JPlag file-count sentence
asserts '84 is higher than 87', which is false on the numbers given.
The fix is mechanical (correct the direction word and / or the
explanation) and does not undermine the comparison's conclusion.

The largest cluster of medium-severity findings concerns a single
recurring conflation: presenting proof-bundle conventions (the
8-value verdict enum, the three-validator-per-bundle convention) as
properties of the DAG-TOML spec, when the spec itself defines a
smaller set and the bundle-level conventions are derived. F2-F03,
Q6-F03, and parts of S1-F02 / F2-F06 all flow from this. A single
clarifying sentence at §sec:spec resolves all of them.

The next cluster concerns reviewer-approval framing (S1-F01, F2-F06):
the paper underplays in §sec:llm-review and §sec:threats what the
Acknowledgments correctly enumerate — that ALL THREE reviewers
ultimately issued unconditional approval on the bundle. The fix is
a sentence-level rewrite in two places.

Source-reliability findings (S2-F01..F05) and unsubstantiated-claim
findings (U4-F01..F04) are normal academic tightening: trim or
substantiate the unsourced vendor and self-citations, add
legal-precision around the SSO claim (C5-F02), and add a localised
non-legal-advice disclaimer at §sec:legal (C5-F01).

The two logical-leap findings (L3-F01, L3-F02) call for definitional
sharpening of two rhetorical phrases ('cone of plausible values',
'no longer cheap'), not for structural changes.

None of the findings constitutes a basis for retracting any
headline number — every C06 signal value and every cross-reference
to the validation_report.json checks out.
"""

