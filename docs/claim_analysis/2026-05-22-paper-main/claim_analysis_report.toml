# U10 — Aggregate report.
#
# Merges the seven per-step findings TOMLs into one structured
# document per [policy.report_shape] of the workflow DAG:
#   - per_finding_required_fields:
#       step_reference, quoted_document_part,
#       problem_explanation, suggested_fix, severity
#   - overall_report_required_fields:
#       per_step_sections, overall_assessment,
#       prioritized_recommendations
#
# All per-step sections appear here even if empty (per
# policy.evidence.empty_per_step_section_must_be_explicit).

