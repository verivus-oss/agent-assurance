# U02 — reference corpus.
#
# Every external claim in paper/main.tex is checked against the
# items here. The corpus is intentionally repo-local plus the
# paper's own bibliography; nothing in this run reaches out to the
# live web. Where a claim relies on something we cannot resolve from
# this corpus, the finding is marked verdict=unverifiable rather
# than silently dropped (per policy.evidence in the DAG).

