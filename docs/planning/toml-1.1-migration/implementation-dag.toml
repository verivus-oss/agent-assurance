# Implementation DAG — TOML 1.0 → TOML 1.1 migration of the validator /
# conformance stack. Self-contained planning document (no upstream
# evidence), so it carries the empty-closure sentinel.
#
# The load-bearing constraint this DAG encodes: the three primary
# parsers are NOT all on the same TOML version today. The Rust `toml`
# crate has a 1.1 line (`1.1.x+spec-1.1.0`, already in tools/dagtoml-rdf),
# and the Go validator already links BurntSushi/toml v1.6.0 (1.1 default)
# at runtime via go.mod — but the Rust *validator* (toml 0.8) and the
# Python reference (stdlib `tomllib`) are still TOML 1.0, and the
# conformance evidence/harness is still 1.0-era. So the repo is latently
# split (see U01). The whole repo invariant is that rs/go/py AGREE on
# every fixture, so 1.1 cannot land piecemeal in one parser alone. The
# DAG therefore gates every parser bump behind a parity spike (U01) and
# an explicit go/no-go decision (U02): if any primary cannot reach 1.1,
# the migration stops at U02 rather than introducing a divergence.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
