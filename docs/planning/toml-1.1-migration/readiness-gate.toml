[meta]
schema_version = "0.1.0"
template_kind  = "readiness-gate"
docs          = "https://github.com/verivus-oss/agent-assurance/blob/main/spec.md"
confidentiality   = "public"
license           = "Apache-2.0"
title          = "Review readiness: TOML 1.0 → 1.1 migration"
status         = "go-confirmed-cleared-for-parser-bumps"
created        = "2026-06-08"
review_subject = "toml-1.1-migration"

[[artifact_classes]]
id          = "A01"
name        = "planning_pack"
description = "The scoping pack for the migration: spec, implementation plan, implementation DAG, contracts, and evidence matrix."

[[artifact_classes]]
id          = "A02"
name        = "parity_decision"
description = "The recorded go/no-go decision proving all three primaries (rs/go/py) can reach TOML 1.1 in lockstep."

[[gates]]
id                 = "G01"
artifact_class     = "A01"
name               = "Planning pack gate"
purpose            = "Block review until the scoping pack is complete and cross-linked."
required_documents = [
  "01_spec.md",
  "03_implementation_plan.md",
  "implementation-dag.toml",
  "contract-declaration.toml",
  "evidence-matrix.toml",
]
required_links     = [
  "implementation-dag.meta.spec to 01_spec.md",
  "implementation-dag.meta.decomposition to 03_implementation_plan.md",
  "contracts cover the cross-implementation parity invariant",
  "evidence matrix links each claim to a pack document",
]
pass_conditions    = [
  "all required documents exist and validate",
  "documents are cross-linked",
  "contract C01 (cross-implementation parity) is declared and verifiable",
]
block_conditions   = [
  "missing prerequisite document",
  "broken cross-link",
]
next_step = "complete and cross-link the planning pack before opening review"

[[gates]]
id                 = "G02"
artifact_class     = "A02"
name               = "Parity go/no-go gate"
purpose            = "Forbid any parser bump until parity across rs/go/py at TOML 1.1 is proven feasible."
required_documents = [
  "research/01-parser-availability-survey.md",
  "research/02-parity-decision.md",
]
required_links     = [
  "parity decision cites the parser-availability survey",
  "decision names a 1.1-capable parser for each of rs, go, and py",
]
pass_conditions    = [
  "a 1.1-capable parser is identified for all three primaries",
  "the go/no-go decision records GO with that evidence",
]
block_conditions   = [
  "any primary lacks a viable TOML 1.1 parser",
  "the survey or decision document is missing",
  "the decision records NO-GO or is unresolved",
]
next_step = "complete the parser-availability spike (U01) and record the go/no-go decision (U02) before any parser bump"
