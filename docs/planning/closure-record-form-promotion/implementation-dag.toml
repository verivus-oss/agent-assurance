# Implementation DAG: promote profile-pinned closure record forms
# (SPEC 12.8) so a profile-descriptor can declare additional labeled
# closure inputs, starting with the com.verivus.runtime api-snapshot
# component digests (descriptor, body, attestation-when-present).
#
# The load-bearing constraint this DAG encodes: the record grammar must
# be frozen and reviewed (U01/U02) BEFORE any of the three closure
# implementations is touched, and the three implementations plus the
# profile pinning must merge as one reviewed stack, because the repo
# invariant is that rs/go/py AGREE on every fixture. The witness-strip
# detection contract (C02) is the property the promotion exists for.
#
# Self-contained planning document (no upstream evidence), so it carries
# the empty-closure sentinel.

# Empty-closure sentinel: SHA-256("") as required by SPEC 12.1.
