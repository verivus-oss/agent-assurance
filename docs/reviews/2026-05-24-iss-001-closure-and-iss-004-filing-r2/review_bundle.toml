[[bundle.units]]
id           = "U06"
commit_sha   = "79fe0aa"
title        = "Move discipline into CONTRIBUTING.md; mark superseded AC; remove dead repo-path refs"
summary      = """
Three files changed:

  (a) CONTRIBUTING.md
      - New "Review Discipline" section (between "Spec Change
        Process" and "Local Checks") with two subsections:
          1. No initiator self-approval — cites ISS-001 +
             tools/review-request-dag.toml [policy.approval] +
             docs/reviews/ as the audit trail vehicle.
          2. Blessed-kind files MUST land with closure_root in
             the same commit — cites ISS-004 + SPEC §12.11 +
             validate_closure_root.py + .github/workflows/validate.yml.
      - Agent-specific note explicitly stating per-session
        host-specific auto-memory (e.g. provider-specific agent CLI's per-project
        memory dir) is NOT a load-bearing safeguard.
      - Added validate_closure_root.py command to Local Checks.

  (b) docs/issues/2026-05-23-ISS-001-self-approval-discipline.md
      - All references to `memory/feedback_no_self_approval.md`
        and `MEMORY.md` (Symptom-area, Resolution Steps, Closing
        note) replaced with explicit descriptions of
        provider-specific agent CLI's per-session host-specific auto-memory
        + pointers to CONTRIBUTING.md "Review Discipline"
        section 1.
      - Original Acceptance criteria preserved verbatim with a
        leading "**Superseded by closing note 2026-05-24.**"
        paragraph + strikethroughs on the four items, each with
        an inline parenthetical explaining what superseded it.
      - Closing note's "live mechanism" list points at
        CONTRIBUTING.md (with relative link) instead of the
        non-existent memory file.

  (c) docs/issues/2026-05-24-ISS-004-blessed-kind-files-must-land-with-closure-root.md
      - Same treatment: references to
        `memory/feedback_blessed_kind_*.md` and
        `[[memory/feedback_no_self_approval.md]]` replaced with
        descriptions of per-agent auto-memory + pointers to the
        ISS-001 closing note in the sibling issue file.
      - Resolution Steps reordered: CONTRIBUTING.md is now step
        1 (load-bearing); auto-memory is step 3 (per-agent
        convenience, not load-bearing).
      - Acceptance criteria updated similarly: load-bearing AC
        is now "CONTRIBUTING.md includes the discipline ...".

Initiator claim:
  $ grep -n 'MEMORY.md\\|memory/feedback_' docs/issues/2026-05-23-ISS-001-self-approval-discipline.md
  189:- ~~`memory/feedback_no_self_approval.md` exists.~~ (Replaced by ...

  $ grep -n 'MEMORY.md\\|memory/feedback_' docs/issues/2026-05-24-ISS-004-blessed-kind-files-must-land-with-closure-root.md
  (no matches)

  $ python3 validators/validate_closure_root.py --discover .
  CLOSURE-ROOT VALIDATION PASSED (74 file(s)).

This claim is plan-compliance language and MUST be independently
verified.
"""
