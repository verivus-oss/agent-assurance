# Terminal decision — IJB primitive #1: referent vs party.
# Synthesized by the initiator from the three verbatim reviewer findings in
# raw_findings/. Per tools/review-request-dag.toml [policy.persistence], the
# raw findings are the source of truth; this file is the synthesis.

[decision]
terminal_state = "adopt_party"
unanimous      = true
date           = "2026-05-31"
summary        = "All three fresh-context reviewers independently recommended adopt_party. referent wins only the legal-risk axis; party wins official-meaning, internal-collision, brand/tone, and directional-ambiguity, with replay/ergonomics a tie. No concrete_unresolvable_blocker: both names are viable; party is the lower-risk continuation of the existence primitive."

[votes]
codex  = "adopt_party"
gemini = "adopt_party"
grok   = "adopt_party"

# Per-axis tally across the three reviewers (prompt's 6 mandatory verifications).
[axes]
"1_official_meaning"      = { winner = "party",    agreement = "unanimous", note = "primitives.md:11-14 defines #1 as 'objects that exist'; referent reframes existence->reference, same category shift that sank matter. 07 draft concedes the reframe is required (07:108-116)." }
"2_internal_collision"    = { winner = "party",    agreement = "unanimous", note = "referent token = 0, but the reference family is saturated (~725-828 reference / ~345-391 references / ~117-122 referenced), incl. enforcement surfaces: canonical-assertion-grammar.md:32 'dereference referenced assertion IDs' and validate_kind_descriptor.py:185 check_references / --check-references-exist. Confused-by-proximity. gemini graded this a blocker." }
"3_legal_regulatory_risk" = { winner = "referent", agreement = "unanimous", note = "Neither is a GDPR hard blocker. party carries legal-register loading (third-party / 'the Parties' / relying-party; enterprise.toml:63). referent has no legal term-of-art. The only axis referent wins." }
"4_brand_tone"            = { winner = "party",    agreement = "unanimous", note = "referent is academic semiotics — the same failure mode that eliminated subject. why-this-matters.md:61 'Resistance to abstraction'; IJB is plain-spoken." }
"5_replay_ergonomics"     = { winner = "tie",      agreement = "majority",  note = "Both drafts drop the noun in high-frequency replay, so human replay is identical. codex leaned party on key/error legibility; gemini+grok scored tie." }
"6_directional_ambiguity" = { winner = "party",    agreement = "unanimous", note = "M-W glosses referent as 'one that refers OR is referred to'; pinning it passive-only is a precision liability for a precision-first framework. party has no built-in converse." }

[decisive_factor]
text = "The first IJB primitive is defined and replayed as EXISTENCE ('objects that exist', primitives.md:11-14; '<Thing> exists' replay, grammar:98-101). referent would (a) reframe that foundation as reference-anchoring and (b) sit inside the repo's already-saturated reference/dereference vocabulary — making the existence primitive sound like just another reference-resolution concept, against a plain-spoken brand."

