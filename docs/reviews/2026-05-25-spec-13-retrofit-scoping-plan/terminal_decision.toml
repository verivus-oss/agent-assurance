description = "Both gemini U07-F2 and codex Q6 flagged that SPEC §13.4 references the descriptor's closure_root 'flipping' on §13-block widening, but per §12.1 / §12.11 a descriptor that cites no upstream evidence stays at the empty-closure sentinel regardless of internal §13 content. This appears to be either a doc-bug in §13.4 OR an implicit assumption that future descriptors will start citing upstream evidence. Worth filing as ISS-005 if it's not already documented elsewhere."
