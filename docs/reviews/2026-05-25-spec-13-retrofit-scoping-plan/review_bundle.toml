role = "corrective-program spec — describes the retrofit work the planning sequence will implement, and is itself the subject of this review"

[bundle.exact_change]
diff_command   = "git show c88f7ea"
single_file    = "docs/planning/2026-05-25-spec-13-retrofit-scoping.md"
insertions     = 313
deletions      = 0
kind_descriptors_touched = []
spec_md_touched          = false
