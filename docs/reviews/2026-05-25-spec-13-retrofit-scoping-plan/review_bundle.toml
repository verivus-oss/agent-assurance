# Review bundle for the SPEC §13 retrofit scoping plan.
# The plan is the "verification report used as the corrective-program
# spec" per the initiator's instruction. Reviewers verify that the
# plan correctly enumerates the kinds, the taxonomy is structurally
# sound, the envelope interpretation matches the spec author's
# intent, and the phasing is appropriate.

# Empty-closure sentinel — SHA-256("") — required by SPEC §12.1.
closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[meta]
schema_version = "1.0.0"
template_kind  = "review-bundle"
created        = "2026-05-25"
review_session = "2026-05-25-spec-13-retrofit-scoping-plan"

[bundle]
repo_root           = "/srv/repos/external/verivus-oss/agent-assurance"
parent_commit       = "6b2d451"
head_commit         = "c88f7ea"
commit_range        = "6b2d451..c88f7ea"
total_commits       = 1
description         = "Single new file at docs/planning/2026-05-25-spec-13-retrofit-scoping.md. Plan to retrofit [kind.abstraction_class] + [kind.capability_envelope] to the 18 blessed *-kind.toml descriptors that do not yet declare them. Plan is reviewable text only; no kind descriptor or SPEC text is modified by c88f7ea. The plan adopts the 'narrow' R1 reading of §13.4 (envelope bounds descriptor parse, not described actions) and proposes a 13-class taxonomy with shared ids across kinds with matching structural rules. Reviewers MUST verify against actual repo bytes and against SPEC §13 prose; do not accept initiator's framing as evidence."

[bundle.workflow_dag]
file        = "/srv/repos/external/verivus-oss/agent-assurance/tools/review-request-dag.toml"
description = "Exact DAG-TOML process governing this review. Reviewers MUST obey [policy.*] in that file. The five questions in plan §12 are the substance of this review."

[bundle.verification_report]
