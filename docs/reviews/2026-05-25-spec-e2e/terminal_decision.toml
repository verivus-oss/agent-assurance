# concrete_unresolvable_blocker. Codex filed one substantive blocker on
# S08 (INV06 enforcement gap) plus three secondary open closures; gemini
# and grok both approved. Initiator cannot rebut: codex constructed two
# negative variants (same-provider/different-family and different-
# provider/same-family) and both passed both primary validators,
# directly contradicting INV06's documented contract.
# Mistral CLI unavailable on host; effective panel = codex / gemini / grok.

closure_root = "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

