id        = "B3-section10.3-overclaim"
filer     = "gemini"
severity  = "concrete (prose)"
location  = "paper/main.tex:1022-1025 (§10.3 introductory sentence)"
defect    = """
The §10.3 introductory sentence reads: 'we cross-validated each number
against an independent re-implementation in scipy and numpy'. This is
the same class of global-scope overclaim that B3 (r2) closed at the
Conclusion. It is false for C06e (validated via stdlib digest + subprocess
to fingerprint_behavior.py, not scipy/numpy) and partially overstated
for AUX1 (corpus digest is stdlib hashlib, not scipy/numpy).

The subsequent paragraph correctly describes C06e's actual validation
path, but the introductory framing precedes that correction and is what
a legal-tier reviewer reads first. Codex's grep recipe missed the
variant ('scipy and numpy' vs 'scipy / numpy'); the substrate is wrong,
not the codex review process.
"""
remediation = """
Scope the §10.3 intro sentence to AUX1+C06a-d explicitly, then let the
C06e paragraph stand on its own as the second validation path — matching
the structural pattern used in the new Conclusion sentence (which r3
unanimously approved).

Proposed replacement (one-sentence edit at paper/main.tex:1022-1025):

  Old: 'we cross-validated each number against an independent
        re-implementation in scipy and numpy'

  New: 'we cross-validated AUX1 and the C06a--d results against an
        independent re-implementation in scipy and numpy (with C06e
        handled separately via stdlib digest re-derivation and a
        subprocess to fingerprint\\_behavior.py, described below)'

This matches the Conclusion's scoping discipline exactly and closes
the recipe-literal version of the same defect class.
"""

