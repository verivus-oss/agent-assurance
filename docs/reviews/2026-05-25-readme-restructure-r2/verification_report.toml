# ----------------------------------------------------------------------
# r1 defect closures: each item names a defect codex/grok filed
# against b759eaf and the byte-level correction shipped in 953691b.
# ----------------------------------------------------------------------

[[closures]]
id          = "D1"
r1_filer    = "grok"
r1_severity = "concrete (blocker)"
defect      = "README.md:179 (at b759eaf) said: `python3 validators/validate_abstraction_class.py --discover .    # SPEC §13`. The script's argparse rejects --discover; running the cited command exits non-zero with `unrecognized arguments: --discover`."
correction  = "Replaced with the same invocation pattern CI uses (mirrors `.github/workflows/validate.yml` around the §13 step): `python3 validators/validate_abstraction_class.py --repo-root . core/*-kind.toml profiles/*/*-kind.toml`."
verify_by = """
1. `grep -n 'validate_abstraction_class.*--discover' README.md` should
   return zero hits at 953691b.
2. `grep -A2 -n 'validate_abstraction_class' README.md` should show
   the new --repo-root + glob invocation.
3. Execute the new command from repo root:
     `python3 validators/validate_abstraction_class.py --repo-root . core/*-kind.toml profiles/*/*-kind.toml`
   Expected: exit 0; output starts with `ABSTRACTION-CLASS VALIDATION
   PASSED`. (Verified locally pre-commit: 19 file(s) checked; 19
   declared a §13 block.)
"""

[[closures]]
id          = "D2"
r1_filer    = "codex + grok (convergent)"
r1_severity = "concrete (blocker)"
defect      = "README.md:142 (at b759eaf) said the Rust primary is `Authoritative for profile-descriptor, disclosure, cost, §2.5–§2.7 meta surface, §11.1 provenance encryption`. False: the primary validators only have modes auto|profile|disclosure|provenance|meta. NO cost mode. Cost-record validation is currently Python-only via validators/validate_cost.py. Cited by codex against tools/dagtoml-validate-rs/src/main.rs:1045-1055 + tools/dagtoml-validate-go/main.go:822-829 (cost handler absent); cross-verified by grok."
correction  = "Removed `, cost` from the primary-coverage list. New text reads: `Authoritative for profile-descriptor, the disclosure-profile kinds, §2.5–§2.7 meta surface, and §11.1 [provenance.encryption] sub-table`."
verify_by = """
1. `grep -n 'Authoritative for.*cost' README.md` should return zero
   hits at 953691b.
2. `grep -nE 'mode (auto|profile|disclosure|provenance|meta|cost)' tools/dagtoml-validate-rs/src/main.rs`
   should show the five-mode set (no cost). Same for the Go side.
3. `ls validators/validate_cost*.py` should show validate_cost.py
   exists (so the README's revised Python-row claim that cost is
   currently Python-only is true).
"""

[[closures]]
id          = "D3"
r1_filer    = "codex + grok (convergent)"
r1_severity = "concrete (blocker)"
defect      = "README.md:143 (at b759eaf) said `Same surface as Rust; CI requires bytewise agreement`. Overstated: .github/workflows/validate.yml runs both primaries sequentially against the same canonical set, both must exit 0, but there is NO byte-diff/compare step between the two outputs. Cited by codex against .github/workflows/validate.yml:184-187."
correction  = "Replaced with the accurate framing: `Same surface as Rust; CI runs both against every canonical example + tier file + profile descriptor on each push, and both must exit 0`."
verify_by = """
1. `grep -n 'bytewise agreement' README.md` should return zero hits
   at 953691b.
2. `grep -A1 -n 'CI runs both' README.md` should show the new
   framing.
3. `grep -nE 'diff|cmp.*output|compare.*primary' .github/workflows/validate.yml`
   should return zero hits in the primary-validator steps (confirming
   there is no byte-comparison step to claim).
"""

# Bonus correction (initiator-flagged, not r1-filed): the Python
# row's prior wording understated Python's role. Now describes it
# as cross-check on the primaries' surface PLUS the Python-only
