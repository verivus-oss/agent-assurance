# ----------------------------------------------------------------------
# R1 blocker disposition.
# ----------------------------------------------------------------------

[r1_blocker_disposition]
r1_blocker_id          = "codex r1 U02-F1"
r1_blocker_description = "paper-arxiv-prep/compile-and-pdf-evidence.toml invalid TOML (bare-key starting with `(`, table-header-as-scalar, Unicode `→` in array)"
fix_commit             = "32936b1"
status                 = "closed"
