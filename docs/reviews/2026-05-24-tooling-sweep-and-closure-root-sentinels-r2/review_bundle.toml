[[bundle.units]]
id           = "U04"
commit_sha   = "32936b1"
title        = "Fix invalid TOML in paper-arxiv-prep/compile-and-pdf-evidence.toml (closes codex r1 blocker)"
summary      = """
Three classes of defect identified by codex r1 are repaired in
one file:
  1. Lines 27-37 — keys beginning with `(a)_..(e)_` (invalid TOML
     bare-key shape, parens not permitted) renamed to
     `acceptance_a_*..acceptance_e_*`. The (a)..(e) mapping to the
     DAG U08 spec language ("Verify (a) exit 0, (b) ...") is
     preserved in the suffix and explained in a header comment.
  2. Lines 44-45 — `[compile_log_size_bytes] = N` and
     `[bibtex_log_excerpt] = "..."` (invalid: table-header syntax
     used for scalar assignment) moved into the existing
     [warnings_and_errors_summary] table as bare keys, where they
     semantically belong.
  3. Line 52 — Unicode `→` used as an infix operator inside an
     array literal (invalid) replaced with `=>` inside the string,
     plus a structured [[checklist_coverage_satisfied.pairs]]
     sub-table making the source→target relation machine-readable.
"""
