# ----------------------------------------------------------------------
# R1/R2 challenge disposition (plan §5 + §7 row 7 + §8 Phase 3).
# ----------------------------------------------------------------------

[r1_r2_challenge_disposition]

[[r1_r2_challenge_disposition.items]]
unit        = "U04"
kind        = "adapter-contract"
class_id    = "interface-contract.v1"
challenge   = "R2: should [kind.capability_envelope] bound the deployed adapter's runtime permissions (network/clock/env) rather than only the descriptor's SPEC-layer validation surface?"
ruling      = "rejected (R1 stands)"
binding_reviewer = "codex (prompt-flagged adversary) and grok (independent confirmer)"
evidence    = """
Two independent byte-level reads converge on the same finding:

  - profiles/agent-assurance/adapter-contract-kind.toml:26-31 (existing
    prose, pre-retrofit) carves out runtime concerns: the contract
    'does NOT carry the adapter binary itself' and execution,
    hermeticity enforcement, and digest verification are RUNTIME-SPEC,
    out of SPEC-layer validation scope.

  - adapter-contract-kind.toml:107-121 places runtime policy on the
    INSTANCE surface as required fields under the [adapter] table
    (runtime_kind, runtime_network_policy, runtime_clock_policy,
    runtime_env_allowlist) — not on the descriptor.

  - examples/minimal-adapter-contract.toml:17-24 demonstrates the
    contract: runtime_* are declared in the instance [adapter] table.

  - The new §13 prose at adapter-contract-kind.toml:201-210 binds the
    envelope to text parse + closed-vocabulary + ABNF + digest-shape
    checks (the descriptor's actual SPEC-layer work); lines 212-218
    explicitly reject R2 as either unbounded (runtime behaviour is
    not a SPEC-layer concern) or duplicative (the instance surface
    already carries it).

Therefore R2 would be a category error: §13 envelopes describe what
the descriptor's OWN validator authority bounds at SPEC-time, not
what a runtime executing an instance of the descriptor may do at
deploy-time. The runtime envelope, if any, belongs in a future
runtime-spec layer, not in agent-assurance §13.
"""

