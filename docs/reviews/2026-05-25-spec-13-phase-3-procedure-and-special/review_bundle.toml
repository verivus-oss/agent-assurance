summary      = """
Appended §13 blocks. This is the kind the plan explicitly flagged
(§7 row 7 + §8 Phase 3) for potential R1/R2 reviewer pushback. The
§13 header comment is extra-explicit:

  - R1 (adopted): the envelope bounds the descriptor parse only
    (text parse + closed-vocabulary checks + ABNF-of-emits +
    digest-shape checks).
  - R2 (rejected with reasoning): would have to cover whatever any
    conforming adapter might require at runtime — either unbounded
    (LLM adapters need network, sandbox adapters need process_spawn,
    signing adapters need crypto_keys) or duplicative of the
    instance-level runtime_* declarations.
  - The runtime capabilities a deployed adapter is permitted at
    execution time are declared INSIDE the instance file's [adapter]
    table (runtime_kind, runtime_network_policy, runtime_clock_policy,
    runtime_env_allowlist) — NOT in this kind descriptor's envelope.

Plan §5 explicitly chose R1 across the board; plan §8 Phase 3 said
ship R1 baseline and revisit only on concrete-evidence blocker.
Reviewers MAY file an R2 blocker IF they can cite evidence in the
kind's existing prose / required-fields / worked example
(examples/minimal-adapter-contract.toml) that the spec author
intended R2.
"""
verify = [
  "git show 3749398 -- profiles/agent-assurance/adapter-contract-kind.toml",
  "sed -n '185,220p' profiles/agent-assurance/adapter-contract-kind.toml   # the §13 header comment with R1/R2 reasoning",
