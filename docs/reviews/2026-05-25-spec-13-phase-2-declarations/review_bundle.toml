this PR — the per-kind-description rule is trivially satisfied for
those. The full set of 14 §13-declaring kinds (cost-record from
Phase 0 + 4 from Phase 1 + 9 from Phase 2) MUST have textually
distinct descriptions for any shared class id.
"""
