"""

[review_instructions]
rules_source  = "tools/review-request-dag.toml [policy.*]"
prompt_path   = "docs/reviews/2026-05-27-agentskills-profile-pitch/review_prompt.md"
narrow_scope  = """
Eight sub-claims total: P01-C1 through P01-C4 for the proposal
draft, and P02-C1 through P02-C4 for the pairing draft. For each,
classify as complete / incomplete / unverifiable with file:line
evidence drawn from current repo state at HEAD 3a480eb and, where
