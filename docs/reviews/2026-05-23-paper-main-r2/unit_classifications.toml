# ============================================================================
# New independent findings raised by R2 reviewers.
# ============================================================================

[[independent_finding]]
id        = "IF-R2-CX-01"
raised_by = "codex"
severity  = "high (blocker)"
location  = "paper/main.tex:1339-1343"
problem   = """
The B1 fix's causal clause is empirically false. The paper now says
'JPlag's bundled ANTLR Python 3 grammar emits parse errors on
chardet/metadata/languages.py ... and the files JPlag cannot parse
are excluded from its token corpus'. Codex's live JPlag rerun
showed JPlag indexed all 84/22 files and assigned token counts to
parse-error files (metadata/languages.py: tokenCount=590), so
'excluded from its token corpus' is wrong.
"""
verified_by_initiator_at_aggregation = true
verification_evidence = """
Direct read of paper/figures/scripts/run_jplag.sh:30-50 confirms the
script's own comment (lines 44-46): 'JPlag emits ANTLR parse errors
on those data files BUT STILL COMPLETES THE COMPARISON; the token-level
similarity is computed across all files JPlag could tokenize.' This
contradicts the paper's 'excluded from its token corpus' claim.
Additionally, the same comment confirms the actual reason for the
84/22 count: JPlag was fed ONLY the v6/chardet/ and v7/src/chardet/
implementation subtrees (lines 37-39), while the extractor walks
full repo roots with test-filename exclusions.
"""
suggested_fix = """
Rewrite the count sentence: '84 v6 .py files plus 22 v7 .py files
are what JPlag indexed under the submission scope used at
paper/figures/scripts/run_jplag.sh:34-39 — only the package
implementation subtrees v6/chardet/ and v7/src/chardet/. The
extractor's 87/33 count covers a broader walk of the full repo
roots with explicit test-file exclusion. Parse errors on
metadata/languages.py (PEP 515 underscore literals) are an
additional v6-only effect; JPlag still tokenises those files and
includes them in the comparison (run_jplag.sh:42-46), so the
parse errors are noise at the data-table layer rather than the
cause of the file-count difference.'
"""

[[independent_finding]]
id        = "IF-R2-GR-01"
raised_by = "grok"
severity  = "medium"
location  = "paper/main.tex:1336-1348 (and 1391-1398)"
problem   = "Same as IF-R2-CX-01 above — Grok independently identified the parse-error story is at best a secondary effect that cannot explain the v7 file-count delta (33 - 22 = 11 files; languages.py is a v6-only data file). Grok rated medium and did not elevate to blocker, but the underlying observation is the same as Codex's."
relationship_to_cx01 = "Same finding, different severity rating. The two together strengthen the case that this is a real factual error introduced by the B1 fix."

[[independent_finding]]
id        = "IF-R2-GE-01"
raised_by = "gemini"
severity  = "low"
location  = "paper/main.tex:1081 (\\cref{tab:adversary})"
problem   = "Cross-reference target is functionally correct (label at paper/main.tex:663 exists) but tab:adversary is physically located in §sec:c06e while the reference is in §sec:related, hundreds of lines later. Stylistically unusual past-tense 'summarised'. Not a defect."
disposition = "Cosmetic; no action recommended."

