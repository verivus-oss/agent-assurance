[[bundle.units]]
id           = "P02"
commit_sha   = "b7e2472"
title        = "INV06 cross-provider gate-decision for self-modification (implementation)"
summary      = """
Closures the initiator claims (must be independently verified):

  B1 closure — chain-verifiable predicate.
    `decision.subject_class` added as optional gate-decision field
    drawn from new subject_class vocabulary
    (profiles/agent-assurance/ontology.toml). Closed values:
    ["downstream-change", "self-modification"], extensible. Presence
    of "self-modification" triggers INV06. Predicate is now a field
    of the artifact, not runtime knowledge.
    Files: profiles/agent-assurance/ontology.toml (new vocab block),
    profiles/agent-assurance/gate-decision-kind.toml (ROOT SHAPE prose
    + INV06 + relation_to_ontology).

  B2 closure — tight AND, not "and/or".
    INV06 statement uses 'MUST satisfy BOTH ... AND ...' with
    explicit text: 'The conjunctive AND is load-bearing:
    same-provider/different-family and different-provider/same-family
    BOTH fail INV06.' No "and/or" anywhere in the rule text.
    File: profiles/agent-assurance/gate-decision-kind.toml INV06.

  B3 closure — solo tier carved out.
    solo.toml C02 statement now reads: "AI agents MAY self-sign
    overrides at any severity_tier at this tier, EXCEPT for
    gate-decisions where `decision.subject_class = \\"self-modification\\"`.
    Self-modification gate-decisions are governed by gate-decision INV06
    ... the solo tier's self-sign permission does NOT relax this."
    C05 reworded similarly: single-signer rule remains for all other
    gate categories; self-modification deferred to INV06. Both gain
    `gate-decision-invariant:INV06@1` in verified_by.
    File: profiles/agent-assurance/tiers/solo.toml.

  R1 closure — additive-optional + conditional invariant.
    The five new fields (subject_class + 4 attribution fields) are
    NOT added to [[kind.required_fields]] — they appear only in the
    ROOT SHAPE prose with the marker "Optional in general. REQUIRED
    when subject_class = \\"self-modification\\" (INV06)." INV06
    encodes the conditional requirement: "When `decision.subject_class
    = \\"self-modification\\"`, ALL FOUR of ... MUST be present ...".
    Pre-INV06 gate-decision instances (no subject_class) remain valid.
    Verified by re-running validate_kind_descriptor.py on the unmodified
    examples/minimal-gate-decision.toml (passes).
    File: profiles/agent-assurance/gate-decision-kind.toml.

  R2 closure — migration + posture.
    overview.md gains a new "Scope and posture" section with three
    paragraphs: (i) multi-provider-only operating posture rooted in
    why same-family review fails, (ii) audience impact paragraph
    naming single-provider / air-gapped / regulated / sealed-appliance
    users and giving three coherent options (accept partial assurance,
    obtain second-provider review path, or stay on core DAG-TOML
    only), (iii) migration note for existing profile users.
    tiers/README.md ladder table solo row annotated; new
    "Cross-tier rule" callout makes INV06's profile-level scope
    explicit.
    Files: profiles/agent-assurance/overview.md,
    profiles/agent-assurance/tiers/README.md.

  R3 closure — no proper-noun in normative prose.
    The word 'federator' / 'agent-federator' appears NOWHERE in the
    committed change (only in the r1 review session's persisted
    audit artifacts, which are out of scope and will remain so).
    Normative prose describes the runtime CONTRACT: 'the SPEC layer
    verifies field presence, vocabulary membership, and the
    inequality predicates; it does NOT verify identity attestations
    cryptographically (that is RUNTIME-SPEC, typically realized by
    a runtime broker that records provider attribution into the
    artifact at decision time).' The implementation topology is
    open.
    Files: profiles/agent-assurance/gate-decision-kind.toml prose,
    profiles/agent-assurance/overview.md "Scope and posture".

  Reference DB + count-mirror plumbing (necessary derived updates).
    postgres/duckdb/sqlite seed.sql each grew by 3 vocab rows + 22
    value rows; engine-specific array syntax used (ARRAY[], [],
    json_array()). MANIFEST.toml counts moved: attribute_vocabularies
    43->46, attribute_values_declared 180->202, per-engine
    attribute_value_allowed 116->138, rdf footer 43->46, rdf
    expected_triple_counts.schema 1329->1400. RDF schema.ttl
    regenerated via tools/dagtoml-rdf/target/release/dagtoml-rdf.
    Rust EXPECTED_COUNTS (tools/dagtoml-duckdb/src/main.rs:24-30)
    and Go expectedCounts (tools/dagtoml-duckdb-go/main.go:38-47)
    bumped to match.

  CHANGELOG.md gains an [Unreleased] Added entry with file-level
  scope description, blocker closures B1-B3 + R1-R3 explicitly
  enumerated, and a pointer to the r1 review session as predecessor.

Initiator claim — local gate sweep:
  $ taplo lint                                # passes
  $ python3 -c '... tomllib.loads ...'        # OK parse-all
  $ for f in core/*-kind.toml profiles/agent-assurance/*-kind.toml; do
      python3 validators/validate_kind_descriptor.py "$f" \\
        --repo-root . --check-references-exist
    done                                       # OK
  $ python3 validators/validate_ijb_conformance.py {core,profile}/ontology.toml
  $ python3 validators/validate_ijb_conformance.py {kind files}
  $ python3 validators/validate_ijb_conformance.py \\
      examples/self-modification-gate-decision.toml --repo-root .
                                               # OK
  $ for t in profiles/agent-assurance/tiers/*.toml; do
      python3 validators/validate_review_readiness.py "$t"
    done                                       # OK
  $ python3 validators/validate_closure_root.py --discover .
                                               # PASSED (75 files)
  $ python3 validators/check_attribute_values.py
                                               # COUNT-MIRROR OK
  $ bash validators/check_manifest_drift.sh
                                               # OK

This is plan-compliance language and MUST be independently
verified by reviewers against repo bytes at b7e2472.
"""
changed_files = [
  "CHANGELOG.md",
  "profiles/agent-assurance/gate-decision-kind.toml",
  "profiles/agent-assurance/ontology.toml",
  "profiles/agent-assurance/overview.md",
