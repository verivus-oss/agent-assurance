  "grep -n 'and/or' profiles/agent-assurance/gate-decision-kind.toml   # MUST return zero matches in INV06 statement",
  "grep -n 'INV06' profiles/agent-assurance/gate-decision-kind.toml profiles/agent-assurance/tiers/solo.toml profiles/agent-assurance/overview.md profiles/agent-assurance/tiers/README.md",
  "python3 validators/validate_kind_descriptor.py profiles/agent-assurance/gate-decision-kind.toml --repo-root . --check-references-exist",
  "python3 validators/validate_ijb_conformance.py profiles/agent-assurance/ontology.toml",
