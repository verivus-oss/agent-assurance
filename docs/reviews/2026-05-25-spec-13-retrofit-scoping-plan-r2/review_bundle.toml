[[bundle.units]]
id           = "U08"
commit_sha   = "073d5c5"
title        = "Close codex r1 blockers on the §13 retrofit plan"
summary      = """
Three classes of fix in one file:

  (a) U07-F1 closure — selective-disclosure-proof reclassified
      Family A in plan row 18; §5 Family-C-exceptions paragraph
      rewritten to preserve the historical proposal as audit
      trail ("Earlier draft proposed... but round-1 review
      caught two defects") and explicitly cite the validator
      vocabularies and the descriptor's RUNTIME-SPEC prose;
      cryptographic-proof.v1 class id retained (artefact-level
      role label, not a parse-capability declaration). §8 Phase
      3 wording updated: "All Family A under R1" (no Family C).

  (b) U07-F2 closure — §6 taxonomy reframed. Class id now
      explicitly described as a "producer-attested label for
      the artefact's role", NOT a "byte-level structural-shape
      contract". Table column renamed from "Description
      (1-line)" to "Role at the artefact level (NOT a
      byte-level shape)". observation-record.v1 row description
      generalised. New per-kind-description rule added below the
      table: when sharing a class id, each kind MUST declare a
      kind-specific [kind.abstraction_class].description.

  (c) U07-F3 closure — §9 "MUST flip" bash comment deleted; only
      "§12 closure-root gate" remains. Prose rewritten as a
      single coherent block explaining (i) sentinel persists per
      §12.1/§12.11, (ii) cost-record at HEAD confirms this, (iii)
      descriptor file's SHA-256 changes but its declared
      closure_root value doesn't, (iv) SPEC §13.4's reference
      to descriptor closure_root flipping is filed as out-of-scope
      ISS-005 candidate in §11.

  Plus: §11 gains an out-of-scope bullet for the SPEC §13.4 vs
  §12.1 tension; §12 (open questions) drops Q4 (SDP envelope —
  now answered) and rewords Q2 to match the reframed taxonomy;
  new §13 (Revision history) records this round transparently.

Initiator claim:
  $ grep -n 'MUST flip' docs/planning/2026-05-25-spec-13-retrofit-scoping.md
  (no matches)

  $ grep -nE 'Family C|entropy_source.*system|crypto_keys.*verify|crypto_keys.*sign' docs/planning/2026-05-25-spec-13-retrofit-scoping.md
  Only 2 matches, both inside the §5 explanatory paragraph
  describing what round-1 caught; not live proposals.

  $ python3 validators/validate_closure_root.py --discover .
  CLOSURE-ROOT VALIDATION PASSED (74 file(s)).

This is plan-compliance language and MUST be independently
verified by reviewers against repo bytes.
"""
changed_files = [
  "docs/planning/2026-05-25-spec-13-retrofit-scoping.md",
]
verify = [
  "git show --stat 073d5c5",
  "git show 073d5c5",
  "cat docs/planning/2026-05-25-spec-13-retrofit-scoping.md",
