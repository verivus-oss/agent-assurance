  "grep -nE 'Family C|entropy_source.*system|crypto_keys.*verify|crypto_keys.*sign' docs/planning/2026-05-25-spec-13-retrofit-scoping.md   # all surviving matches MUST be inside the §5 historical-explanation paragraph, not live proposals",
  "sed -n '180,210p' validators/validate_abstraction_class.py   # the vocabularies codex cited",
  "python3 validators/validate_closure_root.py --discover .",
]

