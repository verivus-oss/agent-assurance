# ----------------------------------------------------------------------
# Verification questions reviewers MUST answer.
# ----------------------------------------------------------------------

[bundle.questions]

[bundle.questions.q1_iss001_factual_accuracy]
prompt = """
Read the ISS-001 closing note in full. Is every factual claim it
makes verifiable against the bytes in the repo at HEAD? Specifically:
  - Does it correctly identify the worked counter-example as the
    2026-05-24 tooling-sweep session?
  - Does it correctly cite raw_findings/codex.md as the file
    containing the r1 blocker evidence?
  - Does it correctly describe the codex r1 finding (invalid TOML
    in paper-arxiv-prep/compile-and-pdf-evidence.toml)?
  - Does it correctly say Safeguards A and B from the original
    ISS-001 were NOT built? Verify by absence: there should be
    NO file at validators/check_review_session_terminal.py and
    NO file at validators/check_commit_message.py.
  - Does it correctly characterise the user's in-session
    correction?
"""

[bundle.questions.q2_iss001_closing_warranted]
prompt = """
Is closing ISS-001 actually warranted, or is it premature? The
original acceptance criteria (in the body of ISS-001 above the
closing note) listed:
  - validators/check_review_session_terminal.py exists and CI is
    red on a commit missing an approved gate decision.
  - memory/feedback_no_self_approval.md exists.
  - An audit comment in this issue lists the prior self-approved
    commits.
  - A future PR that touches files in a review session's
    [bundle].changed_files but lacks an approving terminal verdict
    is blocked at CI.
Only the second of these is satisfied as written. The closing
note argues the others were the wrong framing. Is that argument
sound, or is the issue being closed without meeting its own
acceptance criteria? File a finding either way with evidence.
"""

[bundle.questions.q3_iss004_correctly_framed]
prompt = """
Read ISS-004 in full. Does it correctly:
  - Identify the symptom (47b6acd + d027178 sequence)?
  - Identify the affected files (the five in d027178)?
  - State the rule ('blessed-kind files MUST land with closure_root
    in the same commit') in a way that is enforceable by humans
    without requiring new infrastructure?
  - Avoid proposing new CI tooling as a substitute for discipline?
    Verify by reading the Safeguard A / B / C section.
  - Cite the existing CI gate (validate_closure_root.py in
    .github/workflows/validate.yml) as the existing mechanism?
"""

[bundle.questions.q4_self_approval_recursion]
prompt = """
Commit ca50b2c was self-approved by the initiator (claude-opus-4-7).
This is the recursive boundary case: the commit that closes ISS-001
(an issue about not self-approving) is itself self-approved. The
initiator surfaced this honestly in the response that prompted
this review session. Two opposing positions are tenable:
  (a) Issue-ledger changes are explicitly OUT of §12 conformance
      scope (docs/issues/README.md:7-10) and are process artefacts
      not spec surface, so the dispatched-review discipline does
      not formally apply. Self-approval was acceptable; this
      review is belt-and-braces.
  (b) ISS-001 is the very issue about self-approval, and closing
      it without independent review is exactly the pattern ISS-001
      exists to flag. The closing should have been dispatched for
      review BEFORE landing.
Both positions cite the existing convention. State which position
is correct (or partially correct) with evidence from
docs/issues/README.md, tools/review-request-dag.toml, and
memory/feedback_no_self_approval.md.
"""

[bundle.questions.q5_retcon_check]
prompt = """
Does the ISS-001 closing note retcon anything? Specifically:
  - Does it claim Safeguard A 'was the wrong framing' in a way
    that revises the historical record, or does it correctly
    describe the actual sequence (the framing was proposed by
    initiator, the user pushed back, initiator agreed)?
  - Does ISS-004 retcon any of the 47b6acd / 320a901 / d027178
    commit history?
A retcon would violate the [policy.process_checks].confirm_no_
historical_dated_spec_retconned_without_link_or_correction_note
rule, even though these are not spec files.
"""

