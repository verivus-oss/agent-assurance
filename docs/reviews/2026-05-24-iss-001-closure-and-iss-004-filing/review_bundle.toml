[[bundle.units]]
id           = "U05"
commit_sha   = "ca50b2c"
title        = "Close ISS-001 + file ISS-004 + update issues README"
summary      = """
Three files changed in one commit:

  (a) docs/issues/2026-05-23-ISS-001-self-approval-discipline.md
      - Header: status open → closed; added closed: 2026-05-24
        and closed_by: 884f290 fields.
      - Added a "Closing note (2026-05-24)" section (~50 lines)
        that records (i) the original Safeguards A + B (CI tooling)
        were NOT built and are NOT the mechanism, (ii) the user's
        in-session correction reframing the issue, (iii) the
        2026-05-24 tooling-sweep session as the worked counter-
        example proving independent review catches what self-
        approval misses, (iv) the live mechanism = the rule +
        memory + audit trail (not infrastructure).

  (b) docs/issues/2026-05-24-ISS-004-blessed-kind-files-must-land-with-closure-root.md
      - New file (medium severity).
      - Symptom: 47b6acd added 3 blessed-kind files in tools/
        without closure_root; gate was red until d027178 added the
        sentinels 2 commits later.
      - Safeguards: A (convention — run validator pre-commit),
        B (optional pre-commit hook), C (memory entry +
        CONTRIBUTING.md mention). Explicitly does NOT propose a
        new CI gate as a substitute for discipline, citing
        feedback_no_self_approval and the user correction.

  (c) docs/issues/README.md
      - Index table: ISS-001 status → 'closed (884f290)';
        ISS-004 row added.

The initiator self-approved ca50b2c (this commit). That self-
approval is the recursive boundary case this very review exists
to test: should issue-ledger changes follow the dispatched-review
discipline?
"""
changed_files = [
  "docs/issues/2026-05-23-ISS-001-self-approval-discipline.md",
