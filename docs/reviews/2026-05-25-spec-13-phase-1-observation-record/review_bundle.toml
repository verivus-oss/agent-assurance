predecessor    = "2026-05-25-spec-13-retrofit-scoping-plan-r2"

[bundle]
repo_root             = "/srv/repos/external/verivus-oss/agent-assurance"
parent_commit         = "c63c57a"
head_commit           = "140bd9e"
commit_range          = "c63c57a..140bd9e"
total_new_commits     = 1
description           = """
Single commit (140bd9e) landing the Phase 1 retrofit from the approved
plan. Adds two §13 blocks ([kind.abstraction_class] +
[kind.capability_envelope], Family A — all 9 domains denied/zeroed,
100ms CPU, 1MB memory) to four kind descriptors. Each kind's
[kind.abstraction_class].description is kind-specific and names the
kind's own structural shape (per the per-kind-description rule in plan
§6, lines 201-209). The shared id `observation-record.v1` is a
producer-attested role label, not a byte-level shape contract.
"""

[bundle.plan_lineage]
plan_path                    = "docs/planning/2026-05-25-spec-13-retrofit-scoping.md"
