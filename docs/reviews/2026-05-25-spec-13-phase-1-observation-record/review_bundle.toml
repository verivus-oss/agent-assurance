[[bundle.units]]
id           = "U06"
commit_sha   = "140bd9e"
title        = "Per-kind-description rule satisfied"
summary      = """
Plan §6 requires that kinds sharing a class id MUST each declare a
kind-specific [kind.abstraction_class].description that ties back to
their own [[kind.required_fields]] / [[kind.required_sections]]. The
reference shape is cost-record's description at
profiles/cost/cost-record-kind.toml:284 (\"closed-vocabulary
categorical dimensions + integer quantities\"). The four new
descriptions:

  - evidence-matrix:     names the three connected [[claims]],
                         [[evidence]], [[matrix]] tables.
  - gate-decision:       names verdict, evidence_root, cited_bundles /
                         failed_constraint_refs / override_refs
                         citations, decided_at.
  - assertion-log-record: names index, prev_hash, bundle_hash,
                          signer_id, signature, signature_algorithm,
                          hash_algorithm, canonical_form, timestamp.
  - redaction-manifest:   names [[redactions]] entries with subject,
                          locator, closed-vocabulary redaction_method,
                          redaction_reason (+ conditional notes for
                          reason='other').

All five (including cost-record) share id = 'observation-record.v1'.
No two share a description string. This MUST be verified by reviewers
against the diff bytes.
"""
verify = [
  "grep -n 'observation-record.v1' core/*-kind.toml profiles/*/*-kind.toml profiles/cost/*-kind.toml profiles/disclosure/*-kind.toml",
  "grep -nE '^description ' core/evidence-matrix-kind.toml profiles/agent-assurance/gate-decision-kind.toml profiles/agent-assurance/assertion-log-record-kind.toml profiles/disclosure/redaction-manifest-kind.toml profiles/cost/cost-record-kind.toml",
]

