filer     = "codex"
severity  = "concrete (mechanical — verification_report recipe imprecision more than substrate defect)"
location  = "validators/validate_gate_decision.py:259 vs docs/reviews/2026-05-25-spec-e2e-r2/verification_report.toml:58 (S08.1 verify_by:3)"
defect    = "S08.1 verify_by:3 required `python3 validators/validate_gate_decision.py --help` to print a usage line citing `INV01..INV06`. The shipped script passes only `__doc__.splitlines()[0]` to argparse, so `--help` shows 'Validate a gate-decision instance against' without the invariant enumeration. The INV06 enforcement matrix itself (S08.2-S08.6) passes — codex confirmed all three validators reject both r1 negative variants — but the --help string doesn't satisfy the recipe."
remediation = "One-line fix: expand the argparse description to include INV01..INV06 enumeration. After the fix, `validate_gate_decision.py --help` MUST mention all six invariant IDs."

[decision]
outcome              = "concrete_unresolvable_blocker"
