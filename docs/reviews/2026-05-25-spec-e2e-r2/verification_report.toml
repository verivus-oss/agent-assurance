# remediation at commit 7782ade. R1 (2026-05-25-spec-e2e/) closed at
# concrete_unresolvable_blocker with codex's S08 blocker: no shipped
# validator enforced INV06 (the agent-assurance cross-provider
# self-modification gate-decision invariant). Codex constructed two
# negative variants (same-provider/different-family and
# different-provider/same-family) and BOTH passed both primary
# validators despite INV06's documented conjunctive AND requirement.
#
# Per user direction at the r1 defect-remediation menu (option A:
# "ship the INV06 validator" including Rust/Go mode='gate-decision'),
# commit 7782ade ships INV06 enforcement in all three validator
# implementations + CI wiring with positive + both negative variants.

