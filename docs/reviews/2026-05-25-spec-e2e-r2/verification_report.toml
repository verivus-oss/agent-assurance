# ----------------------------------------------------------------------
# S08 closures to verify against bytes at HEAD 7782ade.
# ----------------------------------------------------------------------

[[closures]]
id        = "S08.1"
title     = "Python reference validator validators/validate_gate_decision.py exists and is well-formed"
verify_by = """
1. ls -l validators/validate_gate_decision.py — must exist.
2. python3 -c 'import py_compile; py_compile.compile(\"validators/validate_gate_decision.py\", doraise=True)' — must exit 0.
3. python3 validators/validate_gate_decision.py --help — must print usage line citing INV01..INV06.
4. Inspect the file: it MUST contain an explicit conjunctive-AND check (e.g., 'same_provider or same_family' rejection logic) — not 'and' (which would be inclusive-OR semantics on rejection). The descriptor's predicate is 'BOTH inequalities must hold' so the rejection is 'EITHER inequality fails'. Confirm this by reading the source.
"""

[[closures]]
id        = "S08.2"
title     = "Python validator passes the worked positive examples"
verify_by = """
Run from repo root:
  python3 validators/validate_gate_decision.py --repo-root . examples/self-modification-gate-decision.toml
  python3 validators/validate_gate_decision.py --repo-root . examples/minimal-gate-decision.toml
Both MUST exit 0 with output 'GATE-DECISION VALIDATION PASSED (1 file checked; INV01..INV06 enforced).'
The minimal example has subject_class absent so INV06 is dormant; the worked self-mod example has anthropic/claude proposing and openai/gpt deciding so BOTH inequalities hold.
"""

[[closures]]
id        = "S08.3"
title     = "Python validator FAILS both r1 negative variants"
verify_by = """
Construct in /tmp:
  neg-same-provider.toml: subject_class=self-modification, proposing anthropic/claude, deciding anthropic/gpt
  neg-same-family.toml:   subject_class=self-modification, proposing anthropic/claude, deciding openai/claude
For each, run python3 validators/validate_gate_decision.py --repo-root . <file>:
  - MUST exit 1
  - Output MUST cite INV06 + the specific equality that violates the AND
  - 'same-provider/different-family and different-provider/same-family BOTH fail INV06' wording MUST appear in the message

If either negative variant passes, the remediation has not closed S08.
"""

[[closures]]
id        = "S08.4"
title     = "Rust primary mod gate_decision enforces INV06 identically"
verify_by = """
1. cd tools/dagtoml-validate-rs && cargo build --release --locked
2. From repo root, run rs=tools/dagtoml-validate-rs/target/release/dagtoml-validate-rs against the same 4-file suite (2 positive + 2 negative). Same expected outcomes as S08.2 + S08.3.
3. Inspect tools/dagtoml-validate-rs/src/main.rs for the new mod gate_decision: confirm the AND predicate is checked as 'same_provider || same_family' rejection (matching Python).
4. Confirm cli::Mode::GateDecision is in the enum and the routing dispatch handles template_kind = 'gate-decision' in auto mode + explicit --mode gate-decision.
"""

[[closures]]
id        = "S08.5"
title     = "Go primary validateGateDecision enforces INV06 identically"
verify_by = """
1. cd tools/dagtoml-validate-go && go build -o /tmp/dagtoml-validate-go ./...
2. Run /tmp/dagtoml-validate-go against the same 4-file suite. Same expected outcomes as S08.2 + S08.3.
3. Inspect tools/dagtoml-validate-go/main.go for validateGateDecision: confirm the AND predicate, modeGateDecision constant, --mode gate-decision parsing, and template_kind='gate-decision' auto-routing.
"""

[[closures]]
id        = "S08.6"
title     = "Three implementations agree (no divergence)"
verify_by = """
Run all three validators against the same positive examples and confirm: every PASS in one MUST be a PASS in the others. Run against both negative variants and confirm: every FAIL in one MUST be a FAIL in the others. Bytewise output may differ (Python prints 'GATE-DECISION VALIDATION PASSED'; primaries print 'DAGTOML VALIDATION PASSED'); the PASS/FAIL outcome MUST agree.

This is the divergence-is-a-build-break principle the README's Validation Tooling section claims; r1 codex flagged that no shipped validator enforced INV06, so this r2 check has to confirm not just one enforcer but three-way agreement.
"""

[[closures]]
id        = "S08.7"
title     = "CI workflow step asserts the positive + negative suite"
verify_by = """
1. grep -n 'Validate gate-decision INV01-INV06' .github/workflows/validate.yml — must find the step.
2. Read the step: it MUST:
   - run python3 validators/validate_gate_decision.py against the two positive examples
   - synthesise both negative variants in a mktemp -d workdir via here-doc
   - assert non-zero exit (via 'if validator passes; then echo REGRESSION; exit 1; fi' pattern) for each negative variant against EACH of the three implementations
3. Confirm CI run for commit 7782ade returned success: `gh run list --branch main --limit 1` should show the most recent push-event CI run as completed/success.
"""

[[closures]]
id        = "S08.8"
title     = "Kind descriptor enforced_by markers no longer say (planned)"
verify_by = """
grep -nE 'enforced_by.*validate_gate_decision' profiles/agent-assurance/gate-decision-kind.toml MUST show 5 entries, NONE containing '(planned)'. The r1-era 'validate_gate_decision.py (planned)' marker is removed on all 5 hard invariants (INV01..INV06 minus INV05 which is scope-declaration-only).
"""

