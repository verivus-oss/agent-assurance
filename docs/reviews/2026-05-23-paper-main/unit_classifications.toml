# ============================================================================
# Independent findings raised by reviewers (NOT in the 29 prior-art).
# These were missed by the self-review.
# ============================================================================

[[independent_finding]]
id        = "IF-CX-01"
raised_by = "codex"
severity  = "high"
location  = "paper/main.tex:992-998"
problem   = "Paper claims validate_numbers.py reproduces the C06e corpus_digest and 0/1000 rate. validate_numbers.py:304-307 explicitly says 'we do not actually invoke chardet here'; validation_report.json:143-145 ('independent.c06e_corpus_check') records digest 8fbc70630c023315, while validation_report.json:22 ('harness_headline') records the headline digest 58e54831f84183c7. The two 16-char digests differ; the paper's reproducibility claim is therefore unsupported by the cited script."
verified_by_initiator_at_aggregation = true
verification_evidence = "Direct read of paper/figures/scripts/validate_numbers.py lines 300-315 and python3 inspection of paper/figures/scripts/validation_report.json keys harness_headline.c06e_corpus_digest=58e54831f84183c7 and independent.c06e_corpus_check.corpus_digest_truncated_16=8fbc70630c023315."

[[independent_finding]]
id        = "IF-CX-02"
raised_by = "codex"
severity  = "medium"
location  = "paper/main.tex:1083-1088"
problem   = "Paper says 'the gate definition treats AUX1 PASS plus C06a..C06e MEASURED as the success state'. REVIEW_READINESS.toml:5-6 explicitly says 'MEASURED / OBSERVED / DELEGATED / SKIP verdicts do NOT block the gate' and REVIEW_READINESS.toml:45-49 defines pass as exit 0 + every contract row + no FAIL. Codex's live run exited 0 with C06e=SKIP — consistent with the gate, inconsistent with the paper's success-state wording."

[[independent_finding]]
id        = "IF-CX-03"
raised_by = "codex"
severity  = "low"
location  = "paper/figures/scripts/run_jplag.sh:2-3"
problem   = "Comment refers to 'Section 9 (Related Work, Tool Comparison subsection)' but JPlag is now in §sec:related-tools / §10.3. Same kind of stale section-number reference as Q6-F01."

[[independent_finding]]
id        = "I-F01"
raised_by = "grok"
severity  = "medium"
location  = "paper/main.tex:1305-1313 + 1353-1357"
problem   = "Adjacent-paragraph self-refutation on the JPlag file-count issue: the first paragraph's causal clause ('JPlag includes more files than the extractor') is directly contradicted by the immediately following paragraph (which correctly names the PEP 515 parse error as the cause of JPlag seeing FEWER files). The self-review captured the numeric contradiction but missed the adjacent-paragraph internal inconsistency."

[[independent_finding]]
id        = "I-F02"
raised_by = "grok"
severity  = "low"
location  = "paper/main.tex:1305-1313"
problem   = "'neither affects the headline' parenthetical dismisses a material experimental detail: JPlag's grammar rejecting PEP 515 literals means its effective corpus is a strict subset of the extractor's, which IS material to the comparison the paper is making."

[[independent_finding]]
id        = "I-F03"
raised_by = "grok"
severity  = "low"
location  = "paper/main.tex:300-303 + examples/proof-chardet-relicense/TRACEABILITY.toml:40"
problem   = "Paper never quotes the exact TRACEABILITY hard-invariant statement when introducing the 8-value verdict enum. Same root issue as F2-F03 but the cite-the-source remedy is concrete."
