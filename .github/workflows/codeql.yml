name: CodeQL

# Advanced-setup CodeQL. Default-setup default-setup is explicitly disabled
# on this repository because GitHub's default-setup API does not currently
# accept "rust" as a language value, and ~33% of this repo's source is
# Rust under tools/. This workflow scans all four languages (build-mode `none` for actions/python/rust, `autobuild` for go)
# and uploads SARIF results to the Security tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 00:17 UTC. Offset from the hour to avoid the burst.
    - cron: "17 0 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go, python, rust]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Wipe the auth token from .git/config after checkout so it
          # cannot be picked up by later steps (zizmor artipacked).
          persist-credentials: false

      - name: Initialize CodeQL (${{ matrix.language }})
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          # Go does not support build-mode "none" — it needs autobuild
          # (or manual). actions/python/rust use the static "none" mode.
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
