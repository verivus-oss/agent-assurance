name: database vocabularies

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  engines:
    if: ${{ false }}
    name: database (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [postgres-floor, postgres-maintained, sqlite-floor, sqlite-maintained, duckdb-floor, duckdb-maintained]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned validator and engine dependencies
        env:
          DATABASE_LANE: ${{ matrix.lane }}
        run: |
          dependency_lock=requirements/database.txt
          if [ "$DATABASE_LANE" = duckdb-floor ]; then dependency_lock=requirements/database-floor.txt; fi
          python3 -m pip install --require-hashes --no-binary tomli -r requirements.txt -r requirements/toml.txt -r "$dependency_lock"
      - name: Execute the pinned engine lane
        env:
          DATABASE_LANE: ${{ matrix.lane }}
        run: python3 validators/database_ci.py --lane "$DATABASE_LANE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-${{ matrix.lane }}
          path: .local/database-ci/
          include-hidden-files: true
          if-no-files-found: error

  loaders:
    if: ${{ false }}
    name: database loader (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, go]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: tools/dagtoml-duckdb-go/go.sum
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - run: python3 -m pip install --require-hashes --no-binary tomli -r requirements.txt -r requirements/toml.txt -r requirements/database.txt
      - name: Build and execute the loader, then probe its database
        env:
          LOADER_LANGUAGE: ${{ matrix.language }}
        run: python3 validators/database_ci.py --loader "$LOADER_LANGUAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-loader-${{ matrix.language }}
          path: .local/database-ci/
          include-hidden-files: true
          if-no-files-found: error

  instruments:
    if: ${{ false }}
    name: database and runtime instruments
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: tools/dagtoml-validate-go/go.sum
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - run: python3 -m pip install --require-hashes --no-binary tomli -r requirements.txt -r requirements/toml.txt -r requirements/database.txt
      - run: python3 validators/runtime_ci.py

  aggregate:
    name: database-vocabulary-gate
    if: ${{ always() }}
    needs: [engines, loaders, instruments]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every dependency to have succeeded
        env:
          DATABASE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 validators/check_database_job_results.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install --require-hashes --no-binary tomli -r requirements.txt -r requirements/toml.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: database-*
          path: .local/database-ci/
          merge-multiple: true
      - name: Require all eight fresh executed receipts and loader binaries
        run: python3 validators/check_sql_source_access.py --no-rdf --receipts .local/database-ci/receipts/*.json
      - name: Require exact generated catalog sections
        run: python3 reference/database/generate_allowed_values.py
      - name: Verify the full-matrix receipt failure controls
        run: python3 validators/check_database_instruments.py --receipts .local/database-ci/receipts/*.json
